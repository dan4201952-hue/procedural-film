        ? pw(u, [[-0.2, B.armR * 0.88], [0, B.armR * 0.92], [0.16 * ue, B.armR * 1.22], [0.6 * ue, B.armR * 0.98], [ue, B.foreR * 1.0], [ue + 0.3 * (1 - ue), B.foreR * 1.13 * f2], [ue + 0.72 * (1 - ue), B.foreR * 0.86], [1, B.foreR * 0.7]])
        : pw(u, [[-0.2, B.armR * 0.9], [0.25 * ue, B.armR * 0.95], [0.55 * ue, B.armR * 1.02], [ue, B.foreR * 0.9], [ue + 0.24 * (1 - ue), B.foreR * 1.05 * f2], [ue + 0.7 * (1 - ue), B.foreR * 0.82], [1, B.foreR * 0.7]]);
  };
  const sleeveLong = (B) => (ju) => {
    const ue = ju[0] || 0.55;
    return (u, outer) =>
      outer
        ? pw(u, [[-0.2, B.armR * 0.98], [0, B.armR * 1.02], [0.16 * ue, B.armR * 1.36], [0.7 * ue, B.armR * 1.2], [ue, B.foreR * 1.42], [1, B.foreR * 1.2]])
        : pw(u, [[-0.2, B.armR * 0.9], [0.2 * ue, B.armR * 1.08], [0.5 * ue, B.armR * 1.14], [ue, B.foreR * 1.3], [1, B.foreR * 1.16]]);
  };
  const sleeveShort = (B) => (ju) => {
    const ue = ju[0] || 0.55;
    return (u, outer) => (outer ? pw(u, [[-0.2, B.armR * 0.98], [0, B.armR * 1.04], [0.16 * ue, B.armR * 1.4], [0.6 * ue, B.armR * 1.3]]) : pw(u, [[-0.2, B.armR * 0.9], [0.25 * ue, B.armR * 1.12], [0.6 * ue, B.armR * 1.24]]));
  };
  const sleeveRolled = (B) => (ju) => {
    const ue = ju[0] || 0.55;
    return (u, outer) => (outer ? pw(u, [[-0.2, B.armR * 0.98], [0, B.armR * 1.02], [0.16 * ue, B.armR * 1.34], [0.7 * ue, B.armR * 1.2], [ue, B.foreR * 1.36]]) : pw(u, [[-0.2, B.armR * 0.9], [0.2 * ue, B.armR * 1.06], [ue, B.foreR * 1.26]]));
  };
  const rollBand = (B) => () => (u, outer) => B.foreR * (outer ? 1.58 : 1.48);
  const puffSleeve = (B) => (ju) => {
    const ue = ju[0] || 0.55;
    return (u, outer) =>
      outer ? pw(u, [[-0.14, B.armR * 1.0], [0, B.armR * 1.1], [0.14 * ue, B.armR * 1.62], [0.32 * ue, B.armR * 1.7], [0.5 * ue, B.armR * 1.3]]) : pw(u, [[-0.14, B.armR * 0.9], [0.22 * ue, B.armR * 1.3], [0.5 * ue, B.armR * 1.2]]);
  };
  const legSkin = (B) => (ju) => {
    const uk = ju[0] || 0.5, c = B.calf || 1;
    return (u, outer) =>
      outer
        ? pw(u, [[-0.1, B.thighR * 1.05], [0.3 * uk, B.thighR * 1.0], [0.85 * uk, B.shinR * 1.18], [uk, B.shinR * 1.06], [uk + 0.27 * (1 - uk), B.shinR * 1.3 * c], [uk + 0.72 * (1 - uk), B.shinR * 0.84], [1, B.shinR * 0.66]])
        : pw(u, [[-0.1, B.thighR * 0.95], [0.5 * uk, B.thighR * 0.84], [uk, B.shinR * 1.0], [uk + 0.2 * (1 - uk), B.shinR * 1.2 * c], [uk + 0.7 * (1 - uk), B.shinR * 0.8], [1, B.shinR * 0.66]]);
  };
  const sockProf = (B) => (ju) => {
    const s = legSkin(B)(ju);
    return (u, outer) => s(u, outer) + 0.14;
  };
  const trouserLeg = (B) => (ju) => {
    const uh = ju[0] || 0.12, uk = ju[1] || 0.55;
    return (u, outer) =>
      outer
        ? pw(u, [[0, B.hip - B.hipJ + 0.3], [uh, B.thighR * 1.12], [lerp(uh, uk, 0.55), B.thighR * 1.02], [uk, B.shinR * 1.34], [lerp(uk, 1, 0.5), B.shinR * 1.3], [1, B.shinR * 1.24]])
        : pw(u, [[0, B.hipJ * 1.1], [uh, B.thighR * 1.02], [uk, B.shinR * 1.24], [1, B.shinR * 1.18]]);
  };
  const leatherLeg = (B) => (ju) => {
    const uh = ju[0] || 0.2;
    return (u, outer) => (outer ? pw(u, [[0, B.hip - B.hipJ + 0.4], [uh, B.thighR * 1.14], [1, B.thighR * 1.0]]) : pw(u, [[0, B.hipJ * 1.12], [uh, B.thighR * 1.06], [1, B.thighR * 0.94]]));
  };
  const neckProf = (B) => () => (u) => B.neckR * lerp(1.14, 0.94, clamp(u));

  // ===========================================================================
  // Parts
  // ===========================================================================

  /** a point in the torso frame: x across (squashed by wf), v up from the pelvis; the frame
   *  turns from the pelvis tilt at the hips to the spine lean at the chest */
  function torsoFrame(B, J, p) {
    const T = B.torso * p.torsoK, pel = J.pel, wf = J.wf;
    return (x, v) => {
      const a = lerp(p.tilt, p.lean, clamp(v / (T * 0.6)));
      const xx = x * wf;
      return [pel[0] + xx * cos(a) + v * sin(a), pel[1] + xx * sin(a) - v * cos(a)];
    };
  }
  function mirrorPts(half, mid) {
    const out = half.slice();
    if (mid) out.push(mid);
    for (let i = half.length - 1; i >= 0; i--) out.push([-half[i][0], half[i][1]]);
    return out;
  }
  function torsoOutline(B, T, hem, neckW, neckDip) {
    const sh = B.shW, ar = B.armR, bel = B.belly || 0;
    const half = [
      [-neckW, T + 1.5],
      [-Math.max(sh * 0.58, neckW + 0.8), T + 0.75],
      [-(sh + ar * 0.82), T - 1.6],
      [-(sh + ar * 0.92), T - 5.2],
      [-B.chest, T - 9.5],
      [-lerp(B.chest, B.waist, 0.45) - bel * 0.3, T * 0.58],
      [-B.waist - bel, T * 0.33],
      [-B.hip - bel * 0.4, 2.6],
      [-B.hip, hem + 1.2],
      [-B.hip * 0.55, hem],
    ];
    const pts = mirrorPts(half, [0, hem - 0.3]);
    pts.push([0, T + neckDip]);
    return pts;
  }

  function contactShadow(R, B, J) {
    const x0 = Math.min(J.ankL[0], J.ankR[0]), x1 = Math.max(J.ankL[0], J.ankR[0]);
    const floor = Math.max(J.ankL[1] - J.liftL, J.ankR[1] - J.liftR) + B.ankleH;
    const rx = (x1 - x0) / 2 + B.shinR * 2.6;
    R.soft([(x0 + x1) / 2, floor - 0.2], rx, rx * 0.15, 0, P.outline, 0.32);
  }

  function drawShoe(R, B, ank, s, z, color, k, side) {
    const zs = 1 + z * 0.05;
    const hw = B.shinR * 1.45 * zs, hh = B.ankleH * 1.05 * zs;
    const ex = side ? 1.7 : 1;
    const cx = ank[0] + s * 0.45 + (side ? side * hw * 0.6 : 0), cy = ank[1] + B.ankleH * 0.42;
    const pts = [[-1, 0.62], [-1.07, 0.02], [-0.85, -0.55], [-0.35, -0.86], [0.35, -0.86], [0.85, -0.55], [1.07, 0.02], [1, 0.62], [0, 0.72]].map(([u, v]) => [cx + u * hw * ex, cy + v * hh]);
    R.form(pts, color, k, { radial: { c: [cx, cy], r: hw * ex }, warm: color === COL.shoeBrown });
    R.fill([[cx - hw * ex, cy + 0.36 * hh], [cx + hw * ex, cy + 0.36 * hh], [cx + hw * ex, cy + 0.62 * hh], [cx, cy + 0.72 * hh], [cx - hw * ex, cy + 0.62 * hh]], mix(color, P.outline, 0.45));
    R.soft([cx - hw * 0.4 * ex, cy - hh * 0.42], hw * 0.34 * ex, hh * 0.2, -0.2, P.gloss, 0.55);
    R.dot([cx - hw * 0.5 * ex, cy - hh * 0.5], hh * 0.09, P.gloss);
  }

  function drawLeg(R, B, J, p, s, st, tf) {
    const S = s < 0 ? 'L' : 'R';
    const hip = J['hip' + S], knee = J['knee' + S], ank = J['ank' + S], z = J['z' + S];
    const k = s < 0 ? 100 : 130;
    const skin = st.skin;
    if (st.kind === 'chef' || st.kind === 'waitress') {
      const path = [hip, knee, ank];
      const uk = hypot(knee[0] - hip[0], knee[1] - hip[1]) / (hypot(knee[0] - hip[0], knee[1] - hip[1]) + hypot(ank[0] - knee[0], ank[1] - knee[1]));
      const u0 = st.kind === 'waitress' ? uk + 0.1 : 0;
      R.tube(path, legSkin(B), u0, 1, ['round', 'open'], skin, k, { warm: true, body: J.pel });
      const top = st.kind === 'chef' ? uk + 0.2 * (1 - uk) : uk + 0.55 * (1 - uk);
      R.tube(path, sockProf(B), top, 1.02, ['flat', 'open'], COL.sock, k + 4, { body: J.pel });
      if (st.kind === 'chef') {
        R.tube(path, (ju) => { const f = sockProf(B)(ju); return (u, o) => f(u, o) + 0.22; }, top - 0.008, top + 0.035, ['flat', 'flat'], COL.sock, k + 8, { body: J.pel, width: R.ow * 0.6 });
        const c = l2(knee, ank, (top + 0.02 - uk) / (1 - uk)), an = atan2(ank[1] - knee[1], ank[0] - knee[0]);
        const nx = -sin(an) * B.shinR * 1.25, ny = cos(an) * B.shinR * 1.25;
        R.line([[c[0] - nx, c[1] - ny], [c[0] + nx, c[1] + ny]], k + 9, { color: COL.sockBand, width: R.dw * 1.6 });
        if (R.U >= 6) {
          const a = l2(knee, ank, 0.45), b = l2(knee, ank, 0.85);
          R.line([[a[0] + s * B.shinR * 0.35, a[1]], [b[0] + s * B.shinR * 0.25, b[1]]], k + 10, { alpha: 0.35 });
        }
      }
      drawShoe(R, B, ank, s, z, st.shoe, k + 12, st.side || 0);
      return;
    }
    // trousers: one continuous leg from under the shirt hem to the shoe
    drawShoe(R, B, ank, s, z, st.shoe, k + 12, st.side || 0);
    const upP = [sin(p.tilt), -cos(p.tilt)];
    const top = [hip[0] + upP[0] * 7, hip[1] + upP[1] * 7];
    R.tube([top, hip, knee, ank], trouserLeg(B), 0, 1, ['open', 'flat'], st.legColor, k, { body: J.pel });
    if (R.U >= 5.5) {
      const kk = l2(hip, knee, 0.93), an = atan2(ank[1] - knee[1], ank[0] - knee[0]);
      const nx = -sin(an), ny = cos(an), w = B.shinR * 1.1;
      R.line([[kk[0] - nx * w * 0.2 * s, kk[1] - ny * w * 0.2 * s], [kk[0] + nx * w * 0.9 * s, kk[1] + ny * w * 0.9 * s + 1.2]], k + 20, { alpha: 0.45 });
    }
  }

  function drawNeck(R, B, J, st) {
    const a = l2(J.chest, J.head, -0.2), b = l2(J.chest, J.head, 0.72);
    R.tube([a, b], neckProf(B), 0, 1, ['open', 'round'], st.skin, 20, { warm: true, body: J.chest });
    const T = tone(st.skin, true);
    const w = st.kind === 'waitress';
    R.soft(l2(J.chest, J.head, 0.52), B.neckR * 1.25, 1.9, J.headAng, w ? T.mid : T.deep, w ? 0.35 : 0.55);
    R.soft(l2(J.chest, J.head, 0.06), B.neckR * 1.4, 1.4, J.headAng, w ? T.mid : T.deep, w ? 0.2 : 0.35);
  }

  function drawSkirt(R, B, J, p, st, tf) {
    const T = B.torso * p.torsoK;
    const sway = st.skirtSway || 0;
    const top = T * 0.36;
    const hy = pelvisY(B) + B.ankleH + B.shin * 0.48, hw = B.hip * 1.42;
    const pts = [
      [-B.waist * 1.02, top], [-B.hip * 1.08, top * 0.45], [-hw * 0.95 + sway, hy + 8], [-hw + sway * 1.4, hy + 0.6],
      [-hw * 0.6 + sway * 1.4, hy - 0.9], [-hw * 0.2 + sway * 1.4, hy - 0.2], [hw * 0.2 + sway * 1.4, hy - 0.9], [hw * 0.6 + sway * 1.4, hy - 0.2],
      [hw + sway * 1.4, hy + 0.6], [hw * 0.95 + sway, hy + 8], [B.hip * 1.08, top * 0.45], [B.waist * 1.02, top],
    ].map((q) => tf(q[0], q[1]));
    const q = R.form(pts, st.skirt || P.dirndlSkirt, 31, { axis: [0, 1] });
    if (st.check && R.draw >= 1) {
      // a blue-and-white check, clipped to the skirt
      const ctx = R.ctx, bb = bboxOf(q), stp = Math.max(4, 2.2 * R.U);
      ctx.save();
      ctx.beginPath();
      crTrace(ctx, q, true);
      ctx.clip();
      ctx.lineWidth = stp * 0.42;
      ctx.strokeStyle = rgba(P.bavWhite, 0.32);
      ctx.beginPath();
      for (let xx = bb.x; xx < bb.x + bb.w; xx += stp) (ctx.moveTo(xx, bb.y), ctx.lineTo(xx, bb.y + bb.h));
      for (let yy = bb.y; yy < bb.y + bb.h; yy += stp) (ctx.moveTo(bb.x, yy), ctx.lineTo(bb.x + bb.w, yy));
      ctx.stroke();
      ctx.restore();
    }
    // folds: a soft shadow strip and a line per fold
    for (const fx of [-0.55, 0.05, 0.62]) {
      const a = tf(B.waist * fx * 1.3, top * 0.6), b = tf(hw * fx * 1.1 + sway * 1.3, hy + 1.2);
      R.soft(l2(a, b, 0.62), 1.1, (hypot(b[0] - a[0], b[1] - a[1]) * 0.42), atan2(b[1] - a[1], b[0] - a[0]) - PI / 2, P.outline, 0.22);
      R.line([l2(a, b, 0.25), b], 32 + fx * 10, { color: P.outline, alpha: 0.4 });
    }
    st.skirtHem = hy;
  }

  function drawTorso(R, B, J, p, st, tf, T) {
    const back = st.back;
    const top = st.top;
    const F = (list) => list.map((q) => tf(q[0], q[1]));
    const spine = [sin(p.lean), -cos(p.lean)];
    let hem = -3.4, dip = back ? 0.6 : -0.8;
    let neckW = B.neckR * 1.2;
    if (top === 'jersey' && !back) dip = -3.4;
    if (top === 'chef' && !back) dip = -5;
    if (top === 'blouse') {
      hem = T * 0.36;
      dip = back ? 0.6 : -1.3;
      if (st.neck === 'low' && !back) {
        // the traditional low, rounded dirndl neckline: natural, in proportion
        neckW = Math.min(B.neckR * 2.4, B.shW * 0.58);
        dip = -6.9;
        R.form(F([[-neckW * 1.02, T + 1.3], [neckW * 1.02, T + 1.3], [neckW * 0.86, T - 3.4], [0, T - 7.0], [-neckW * 0.86, T - 3.4]]), st.skin, 34, { warm: true, outline: false, axis: spine });
        R.soft(tf(0, T - 6.3), 0.7, 1.4, 0, tone(st.skin, true).core, 0.3);
        R.line(F([[-neckW * 0.85, T - 0.1], [-neckW * 0.35, T - 0.9]]), 33, { alpha: 0.3 });
        R.line(F([[neckW * 0.85, T - 0.1], [neckW * 0.35, T - 0.9]]), 32, { alpha: 0.3 });
      }
    }
    const color = st.topColor;
    if (top === 'chef' && !back) R.form(F([[-neckW * 1.2, T + 1.2], [neckW * 1.2, T + 1.2], [0, T - 6]]), st.skin, 34, { warm: true, outline: false });
    const outline = torsoOutline(B, T, hem, neckW, dip);
    if (top === 'hoodie' && !back) R.form(F([[-B.shW * 0.72, T - 0.5], [-B.shW * 0.64, T + 2.9], [0, T + 3.5], [B.shW * 0.64, T + 2.9], [B.shW * 0.72, T - 0.5]]), mix(color, P.outline, 0.12), 35, { axis: spine });
    R.form(F(outline), color, 36, { axis: spine });
    if (st.overJersey != null) return drawJerseyOver(R, B, J, p, st, tf, T, F);
    // folds at the waist, the belly curve on a heavy build
    if (R.U >= 4.2 && top !== 'blouse') {
      R.line(F([[-B.chest * 0.92, T * 0.5], [-B.chest * 0.62, T * 0.4], [-B.chest * 0.42, T * 0.42]]), 40, { alpha: 0.5 });
      R.line(F([[B.chest * 0.95, T * 0.44], [B.chest * 0.7, T * 0.32], [B.chest * 0.48, T * 0.3]]), 41, { alpha: 0.5 });
    }
    if (B.belly > 0.8 && !back) {
      R.line(F([[-B.waist * 0.7, T * 0.2], [0, T * 0.1], [B.waist * 0.75, T * 0.2]]), 42, { alpha: 0.4 });
      R.soft(tf(-B.waist * 0.25, T * 0.34), B.waist * 0.5, 3, 0, P.gloss, 0.12);
    }
    if (st.kind === 'chef') return drawChefClothes(R, B, J, p, st, tf, T, F);
    if (st.kind === 'waitress') return drawBodice(R, B, J, p, st, tf, T, F);
    const detail = { color: P.outline, alpha: 0.55 };
    if (!back) {
      if (top === 'tee' || top === 'sweater' || top === 'hoodie' || top === 'octo') {
        const band = [[-neckW * 1.3, T + 1.3], [0, T - 1.8], [neckW * 1.3, T + 1.3], [neckW * 0.98, T + 1.35], [0, T - 0.6], [-neckW * 0.98, T + 1.35]];
        R.form(F(band), top === 'octo' ? P.fesbBlue : mix(color, P.outline, 0.18), 38, { axis: spine, width: R.ow * 0.6 });
      }
      if (top === 'sweater') R.line(F([[-B.hip * 0.95, hem + 2.2], [0, hem + 1.9], [B.hip * 0.95, hem + 2.2]]), 39, detail);
      if (top === 'hoodie') {
        R.line(F([[-B.hip * 0.5, T * 0.12], [-B.hip * 0.62, T * 0.4], [B.hip * 0.62, T * 0.4], [B.hip * 0.5, T * 0.12]]), 39, detail);
        R.stroke(F([[-1.3, T - 1.2], [-1.5, T - 6.5]]), 0.35, COL.white, 0.9);
        R.stroke(F([[1.3, T - 1.2], [1.5, T - 6.5]]), 0.35, COL.white, 0.9);
      }
      if (top === 'shirt') {
        const cc = mix(color, P.gloss, 0.22);
        R.form(F([[-neckW * 1.55, T + 1.4], [-0.2, T - 2.8], [-neckW * 0.55, T - 3.4], [-neckW * 1.85, T - 0.8]]), cc, 38, { axis: spine, width: R.ow * 0.6 });
        R.form(F([[neckW * 1.55, T + 1.4], [0.2, T - 2.8], [neckW * 0.55, T - 3.4], [neckW * 1.85, T - 0.8]]), cc, 39, { axis: spine, width: R.ow * 0.6 });
        R.line(F([[0.4, T - 3], [0.5, hem + 0.8]]), 43, detail);
        for (let i = 0; i < 3; i++) R.dot(tf(1.3, T - 7.5 - i * 7), 0.42, mix(color, P.gloss, 0.6));
      }
      if (top === 'jersey') {
        const v = [[-neckW * 1.32, T + 1.3], [0, T - 4.5], [neckW * 1.32, T + 1.3], [neckW * 0.98, T + 1.35], [0, T - 3.0], [-neckW * 0.98, T + 1.35]];
        R.form(F(v), COL.white, 38, { axis: spine, width: R.ow * 0.6 });
        chestLogo(R, tf(B.chest * 0.44, T - 8.6), B.chest * 0.34 * J.wf, B.chest * 0.34);
      }
      if (top === 'octo') octoChest(R, tf(0, T * 0.52), B.chest * 1.05);
    } else {
      R.line(F([[-neckW * 1.2, T + 1.2], [0, T + 0.3], [neckW * 1.2, T + 1.2]]), 38, { color: P.outline, alpha: 0.5 });
      if (top === 'jersey') {
        // "FESB" over a huge "9": the number is 45 % of the back's height
        const wq = (0.45 * (T + 3.4)) / 1.12;
        const c = R.m(tf(0, T * 0.47));
        if (R.draw >= 1) jerseyPrint(R.ctx, c[0], c[1], wq * J.wf * R.U, wq * R.U, st.gleam || 0);
      }
      if (top === 'octo') chestLogo(R, tf(0, T - 6), B.chest * 0.3 * J.wf, B.chest * 0.3);
      if (top === 'shirt') R.line(F([[-B.chest * 0.95, T - 5], [0, T - 6.5], [B.chest * 0.95, T - 5]]), 39, { color: P.outline, alpha: 0.4 });
      if (top === 'hoodie') R.form(F([[-B.shW * 0.8, T + 0.6], [B.shW * 0.8, T + 0.6], [B.shW * 0.45, T - 9], [0, T - 11], [-B.shW * 0.45, T - 9]]), mix(color, P.outline, 0.08), 37, { axis: spine });
    }
  }

  function drawJerseyOver(R, B, J, p, st, tf, T, F) {
    const hemV = st.overJersey;
    const neckW = B.neckR * 1.2;
    const outline = torsoOutline(B, T, -3.4, neckW, -3.4).map((q) => [q[0] * 1.04, Math.max(q[1], hemV)]);
    R.form(F(outline), P.fesbBlue, 44, { axis: [sin(p.lean), -cos(p.lean)] });
    R.form(F([[-neckW * 1.32, T + 1.3], [0, T - 4.5], [neckW * 1.32, T + 1.3], [neckW * 0.98, T + 1.35], [0, T - 3.0], [-neckW * 0.98, T + 1.35]]), COL.white, 45, { width: R.ow * 0.6 });
    R.soft(tf(0, hemV - 1.2), B.hip * 1.1, 1.4, 0, P.outline, 0.3);
  }

      shoe: COL.shoeBrown, back, look, hands, bandana: p.bandana, gleam: num(o.gleam, 0), tails: p.tails || 0,
      armBehind: !back && spin != null && Math.abs(c) < 0.4 ? (sin(ph) > 0 ? 'R' : 'L') : null, ground: o.shadow !== false,
      head: { key: 'chef|' + p.expr + '|' + lookKey(look) + '|' + Math.round((p.nod || 0) * 4) + '|' + (back ? 1 : 0) + '|' + bandana, H: Object.assign({}, CHEF_HEAD, { expr: p.expr, look: lookQ(look), nod: nodQ(p.nod), back, bandana }) },
    };
    ctx.save();
    if (alpha < 1) ctx.globalAlpha *= alpha;
    drawFigure(R, B, J, p, st);
    // the bandana while it is being tied
    if (p.bandana === 'hand') {
      const hnd = J.hcR;
      const pts = [[hnd[0] - 1, hnd[1]], [hnd[0] + 2.6, hnd[1] + 1], [hnd[0] + 3.6, hnd[1] + 9], [hnd[0] + 0.5, hnd[1] + 12], [hnd[0] - 1.8, hnd[1] + 7]];
      R.form(pts, P.bandana, 400, { warm: true });
      for (const d of [[0.8, 4], [1.6, 8], [-0.4, 7.5], [2.2, 5.5]]) R.dot([hnd[0] + d[0], hnd[1] + d[1]], 0.45, P.bandanaDot);
      drawHand(R, B, J.wrR, J.haR, 1, 'fist', st.skin, 405, back);
    } else if (p.bandana === 'stretch') {
      const a = J.hcL, b = J.hcR;
      const sag = 3;
      const pts = [[a[0], a[1] - 1.6], [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - 1.2 + sag * 0.4], [b[0], b[1] - 1.6], [b[0], b[1] + 1.6], [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + sag], [a[0], a[1] + 1.6]];
      R.form(pts, P.bandana, 401, { warm: true, axis: [b[0] - a[0], b[1] - a[1]] });
      for (let i = 1; i < 6; i++) {
        const q = l2(a, b, i / 6);
        R.dot([q[0], q[1] + sag * 0.45 * sin((i / 6) * PI)], 0.5, P.bandanaDot);
      }
      drawHand(R, B, J.wrL, J.haL, -1, 'fist', st.skin, 406, back);
      drawHand(R, B, J.wrR, J.haR, 1, 'fist', st.skin, 407, back);
    }
    const handR = R.m(J.hcR);
    if (o.mug) {
      const tilt = num(o.mug.tilt, 0);
      const g = mugGrip(mh, !!o.flip, tilt);
      MUG(ctx, handR[0] - g[0], handR[1] - g[1], mh, Object.assign({ line: o.line, width: R.ow * 0.85, t: num(pose.t, 0) }, o.mug, { flip: !!o.flip }));
      drawHand(R, B, J.wrR, J.haR, 1, 'grip', st.skin, 410, back);
    }
    ctx.restore();
    return { handR, handL: R.m(J.hcL), head: R.m(J.head) };
  }

  // ===========================================================================
  // chefHand, chefBeardEdge (shot 02)
  // ===========================================================================

  function chefHand(ctx, x, y, s, o) {
    o = o || {};
    s = num(s, 1);
    const alpha = o.alpha == null ? 1 : clamp(o.alpha);
    if (alpha <= 0) return;
    const press = clamp(num(o.press, 0));
    // local units: 1 = 3 px at s = 1 (wrist to fingertip about 85 units = 255 px); fingertip at (0, 0)
    const R = makeRig(ctx, x, y, 100 * s * 3, { line: o.line || 'hero', draw: o.draw, flip: o.flip }, 'chefHand', 300);
    R.rim = Math.max(1.5, 4 * s);
    const fl = 40 * (1 - 0.42 * press);
    const kn = -fl, wy = kn - 44;
    const skin = P.chefSkin;
    const sk = { warm: true, axis: [0, 1] };
    ctx.save();
    if (alpha < 1) ctx.globalAlpha *= alpha;
    R.form([[-31, wy - 700], [31, wy - 700], [33, wy - 30], [31, wy - 6], [-31, wy - 6], [-33, wy - 30]], COL.hoodie, 1, { axis: [0, 1] });
    R.line([[-14, wy - 120], [-8, wy - 50]], 2, { color: mix(COL.hoodie, P.outline, 0.5), width: R.dw * 1.3 });
    R.line([[16, wy - 90], [10, wy - 40]], 3, { color: mix(COL.hoodie, P.outline, 0.5), width: R.dw * 1.3 });
    R.form([[-23, wy - 2], [21, wy - 2], [26, wy + 16], [27, kn + 1], [12, kn + 5], [-6, kn + 5], [-26, kn + 3], [-29, kn - 12], [-27, wy + 14]], skin, 4, sk);
    R.soft([6, wy + 22], 12, 8, 0, P.gloss, 0.14);
    for (let i = 0; i < 3; i++) {
      const x0 = -28 + i * 10.4, len = i === 0 ? 8 : 11;
      R.form([[x0, kn - 4], [x0 + 10.6, kn - 4], [x0 + 10.8, kn + len - 3], [x0 + 5.4, kn + len + 1.5], [x0 - 0.2, kn + len - 3]], skin, 5 + i, sk);
    }
    R.line([[-24, kn - 8], [-12, kn - 10], [-1, kn - 9]], 8, { alpha: 0.45 });
    R.form([[3.4, kn + 1], [16.6, kn + 1], [16, kn + 10], [7, -9], [4.5, -2], [0.5, 0.2], [-3.4, -2], [-5.2, -8], [3, kn + 12]], skin, 9, sk);
    R.form([[-3.4, -12.5], [4.2, -12.5], [4.2, -6], [0.4, -3.4], [-3.6, -6]], mix(skin, P.gloss, 0.5), 10, { width: R.dw * 1.1, warm: true });
    const mj = l2([10, kn + 3], [0.5, -6.2], 0.45);
    R.line([[mj[0] - 4.5, mj[1] - 1], [mj[0] + 4.5, mj[1] + 0.5]], 11, { alpha: 0.7 });
    R.form([[20, wy + 12], [28, wy + 16], [26, kn - 4], [22.6, kn + 1], [17.4, kn - 1], [17, wy + 24]], skin, 12, sk);
    R.form([[17.6, kn - 7], [22.4, kn - 7], [22.6, kn - 2], [20, kn + 0.8], [17.4, kn - 2]], mix(skin, P.gloss, 0.5), 13, { width: R.dw, warm: true });
    R.line([[-12, wy + 16], [-4, wy + 10]], 14, { alpha: 0.45 });
    R.form([[-32, wy - 26], [32, wy - 26], [31, wy + 4], [-31, wy + 4]], COL.hoodie, 15, { axis: [0, 1] });
    for (let i = -2; i <= 2; i++) R.line([[i * 11, wy - 22], [i * 11, wy + 1]], 16 + i, { color: mix(COL.hoodie, P.outline, 0.5) });
    ctx.restore();
  }

  /** the chef's chin with his short trimmed beard, entering from the top of the frame; (x, y) is
   *  the bottom of the beard, w the width of the jaw; the face above stays off frame (shot 02) */
  function chefBeardEdge(ctx, x, y, w, o) {
    o = o || {};
    w = num(w, 360);
    const alpha = o.alpha == null ? 1 : clamp(o.alpha);
    if (alpha <= 0) return;
    const R = makeRig(ctx, x, y, w, { line: o.line || 'hero', draw: o.draw, flip: o.flip }, 'chefBeard', 360);
    const arc = (rx, ry, cy, n, rev) => {
      const out = [];
      for (let i = 0; i <= n; i++) {
        const a = (rev ? 1 - i / n : i / n) * PI;
        out.push([cos(a) * rx, cy + sin(a) * ry]);
      }
      return out;
    };
    ctx.save();
    if (alpha < 1) ctx.globalAlpha *= alpha;
    R.form([[-51, -170], [51, -170], ...arc(51, 72, -72, 16, false).slice(0, 17)], P.chefSkin, 1, { warm: true, radial: { c: [0, -60], r: 60 } });
    const band = [...arc(51, 72, -72, 18, false), ...arc(44, 56, -76, 18, true)];
    const T2 = { lit: mix(P.beard, P.beardLight || P.beard, 0.9), base: P.beard, mid: P.beard, core: mix(P.beard, P.outline, 0.3), rim: mix(P.beard, P.bavWhite, 0.18) };
    const q = R.M(band);
    if (R.draw >= 1) {
      rampFill(ctx, q, T2, 1, 0, R.rim);
      const r = L.rng(71);
      ctx.lineCap = 'round';
      for (let i = 0; i < 60; i++) {
        const a = r.range(0.05, 0.95) * PI, rr = r.range(0.2, 0.9);
        const px = cos(a) * lerp(44, 51, rr), py = lerp(-76 + sin(a) * 56, -72 + sin(a) * 72, rr);
        const p0 = R.m([px, py]), p1 = R.m([px + cos(a) * 0.5, py + 3.2]);
        ctx.strokeStyle = i < 6 ? P.beardGrey : px < 0 ? (P.beardLight || P.beard) : mix(P.beard, P.outline, 0.4);
        ctx.globalAlpha = 0.6;
        ctx.lineWidth = Math.max(0.8, R.dw * 0.8);
        ctx.beginPath();
        ctx.moveTo(p0[0], p0[1]);
        ctx.lineTo(p1[0], p1[1]);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    ink(ctx, R.M(arc(51, 72, -72, 18, false)), { width: R.ow, seed: R.seed + 3, draw: R.draw });
    ctx.restore();
  }

  // ===========================================================================
  // waitresses (art bible 10.2)
  // ===========================================================================

  const WAIT = {
    liesl: { style: 'crown', hairColor: 'hairBlonde', skin: 'skinA', iris: 'blue', bodice: P.dirndlBodice, skirt: P.dirndlSkirt, apron: P.dirndlApron, neck: 'low', tall: 1.0, fig: { chest: 12.2, waist: 10.6, hip: 14.2 } },
    resi: { style: 'bun', flower: true, hairColor: 'hairBrown', skin: 'skinB', iris: 'brown', bodice: P.dirndlSkirt, skirt: P.dirndlBodice, apron: L.mix(P.foam, P.foamShade, 0.35), neck: 'low', tall: 0.96, fig: { chest: 12.9, waist: 10.2, hip: 15.3 } },
    vroni: { style: 'braids', hairColor: 'hairRed', skin: 'skinA', iris: 'green', bodice: L.mix(P.outline, P.fesbDeep, 0.35), skirt: P.dirndlApron, check: true, apron: P.shirtWhite, neck: 'high', tall: 0.99, fig: { chest: 11.2, waist: 9.3, hip: 12.6, armR: 3.3, foreR: 2.8 } },
    gretl: { style: 'ponytail', ribbon: L.mix(P.confettiD, P.dirndlSkirt, 0.3), hairColor: 'hairFair', skin: 'skinA', iris: 'hazel', bodice: L.mix(P.confettiD, P.gloss, 0.3), skirt: L.mix(P.bavBlue, P.outlineSoft, 0.55), apron: L.mix(P.confettiD, P.gloss, 0.62), neck: 'low', tall: 1.06, fig: { chest: 12.6, waist: 11.0, hip: 14.8 } },
  };
  const FAN = { x: 180 / 820, y: 400 / 820, mh: 136 / 820 };
  const FAN_MUGS = [
    // [x, y] in mug heights from the fan centre (the fist), tilt, handle side flip, draw order
    { i: 2, x: 0, y: -0.14, tilt: 0, flip: false },
    { i: 0, x: -0.72, y: 0.1, tilt: 0.26, flip: false },
    { i: 4, x: 0.72, y: 0.1, tilt: -0.26, flip: true },
    { i: 3, x: 0.46, y: 0.03, tilt: -0.1, flip: true },
    { i: 1, x: -0.46, y: 0.03, tilt: 0.1, flip: false },
  ];
  function waitressHead(who, Wd, expr, look) {
    const skin = skinOf(Wd.skin);
    return {
      kind: 'waitress', who, style: Wd.style, flower: Wd.flower, ribbon: Wd.ribbon, hairColor: Wd.hairColor, skin, build: 'full',
      eyeY: 0.03, eyeX: 0.205, eyeW: 0.122, eyeH: 0.066, iris: IRIS[Wd.iris] || IRIS.blue, browT: 0.021, browArch: 0.032, browLift: 0.068,
      brow: L.mix(browOf(Wd.hairColor), P.outlineSoft, 0.2), noseY: 0.2, noseW: 0.054, mouthY: 0.31, mouthW: 0.148, lip: L.mix(L.mix(skin, P.confettiD, 0.55), P.dirndlSkirt, 0.12), lines: false, forehead: false,
      expr, look, seed: L.hash('w', who) % 1000,
    };
  }
  /** a plate of food whose centre is (x, y), w px wide: 'knuckle' | 'pretzels' | 'sausages' */
  function plateFood(ctx, x, y, w, kind, line) {
    const pr = PR();
    if (kind === 'pretzels' || typeof pr.knuckle !== 'function') {
      const pts = ell(x, y, w * 0.5, w * 0.13, 22);
      ctx.beginPath();
      crTrace(ctx, pts, true);
      ctx.fillStyle = radRamp(ctx, x, y, w * 0.5, tone(P.plate, false), 0.05);
      ctx.fill();
      ink(ctx, pts, { closed: true, width: Math.max(1.5, w / 70), seed: 91 });
      if (typeof pr.pretzel === 'function') {
        pr.pretzel(ctx, x - w * 0.16, y + w * 0.02, w * 0.36, { rot: -0.2, line });
        pr.pretzel(ctx, x + w * 0.17, y + w * 0.03, w * 0.34, { rot: 0.25, line });
      }
      return;
    }
    if (kind === 'sausages' && typeof pr.sausages === 'function') {
      pr.sausages(ctx, x, y + w * 0.12, w * 0.6, { line });
      return;
    }
    pr.knuckle(ctx, x, y + w * 0.13, w / 1.9, { line });
  }

  function waitress(ctx, x, y, h, pose, o) {
    o = o || {};
    pose = pose || { name: 'stand' };
    const who = WAIT[o.who] ? o.who : 'liesl';
    const Wd = WAIT[who];
    const hh = h * Wd.tall;
    const alpha = o.alpha == null ? 1 : clamp(o.alpha);
    const facing = o.facing === -1 ? -1 : 1;
    const flip = (o.flip ? -1 : 1) * facing < 0;
    const carry = o.carry === 'plate' || o.carry === 'none' ? o.carry : 'mugs';
    const U = hh / 100;
    const fanPx = (sx) => [x + (flip ? -1 : 1) * sx * FAN.x * hh, y - FAN.y * hh];
    if (alpha <= 0) return flip ? { fanL: fanPx(1), fanR: fanPx(-1) } : { fanL: fanPx(-1), fanR: fanPx(1) };
    const B = Object.assign(waitressBody(), Wd.fig);
    const walk = pose.name === 'walk';
    const clap = pose.name === 'clap';
    const t = Math.max(0, num(pose.t, 0));
    const n = Math.floor(t / 0.5 + 1e-6), fr = walk ? t / 0.5 - n : 0;
    const even = n % 2 === 0;
    const bob = walk ? -1.46 * sin(PI * fr) : 0;
    const lag = walk ? 0.9 * sin(PI * fr - 0.9) : 0;
    const fist = [FAN.x * 100, -FAN.y * 100 + lag - bob * 0.3];
    let fL = [-5.5, 0, 0], fR = [5.5, 0, 0], px = 0, tilt = 0;
    if (walk) {
      const lift = 3.2 * sin(PI * fr), g = even ? 1 : -1;
      if (even) fR = [6.5, lift, 0.6 * sin(PI * fr)];
      else fL = [-6.5, lift, 0.6 * sin(PI * fr)];
      px = -g * 1.1 * sin(PI * fr);
      tilt = g * 0.05 * sin(PI * fr);
    } else if (!clap) (px = 1.1), (tilt = -0.045), (fL = [-6.5, 0.9, 0.5]);
    const base = { py: 0.4 + bob, px, tilt, fL, fR, kneeL: walk && !even ? -1 : !walk && !clap ? -1 : 1, kneeR: walk && even ? -1 : 1, lean: walk ? 0.02 * sin(TAU * t) : 0, shL: -0.2, shR: -0.2, expr: 'grin', head: walk ? 0.03 * sin(TAU * t) : 0.04 };
    let arms;
    if (clap) arms = clapPose(B, t, {});
    else if (carry === 'mugs') arms = { ikL: [-fist[0], fist[1] + bob, 1, 0.2, 0], ikR: [fist[0], fist[1] + bob, 1, 0.2, 0], hands: ['none', 'none'] };
    else if (carry === 'plate') arms = { ikR: [B.shW + 6, headY(B) + 9, 1, 0.8, -1.4], aL: [0.82, -1.78, 0.3], hands: ['fist', 'open'] };
    else arms = { aL: [0.82, -1.78, 0.3], aR: [0.82, -1.78, 0.3], hands: ['fist', 'fist'] };
    const p = resolve(B, Object.assign(base, arms));
    p.look = 0.3;
    const J = solve(B, p);
    const R = makeRig(ctx, x, y, hh, { line: o.line, draw: o.draw, flip }, 'waitress-' + who);
    const expr = 'smile';
    const H = waitressHead(who, Wd, expr, 0.3);
    const st = {
      kind: 'waitress', who, skin: skinOf(Wd.skin), top: 'blouse', neck: Wd.neck, topColor: P.shirtWhite, sleeve: 'puff', sleeveColor: P.shirtWhite,
      bodice: Wd.bodice, skirt: Wd.skirt, apron: Wd.apron, check: Wd.check, shoe: COL.shoe, back: false, look: 0.3, hands: p.hands, ground: o.shadow !== false,
      skirtSway: walk ? -1.4 * sin(TAU * t * 0.5 + 0.6) : 0,
      head: { key: 'w-' + who + '|' + expr + '|3|0|0', H },
    };
    ctx.save();
    if (alpha < 1) ctx.globalAlpha *= alpha;
    drawFigure(R, B, J, p, st);
    const out = { fanL: R.m(J.hcL), fanR: R.m(J.hcR) };
    if (carry === 'mugs') {
      const mh = FAN.mh * hh;
      for (const s of [-1, 1]) {
        const S = s < 0 ? 'L' : 'R';
        const c = R.m(J['hc' + S]);
        const slosh = walk ? 0.6 * sin(PI * fr + (s < 0 ? 0.6 : 0)) : 0;
        const list = s > 0 ? FAN_MUGS : FAN_MUGS.map((m) => ({ i: m.i, x: -m.x, y: m.y, tilt: -m.tilt, flip: !m.flip }));
        const ff = flip ? -1 : 1;
        for (const m of list) {
          const cx = c[0] + ff * m.x * mh, cy = c[1] + m.y * mh;
          const tl = ff * m.tilt;
          const bx = cx - 0.5 * mh * sin(tl), by = cy + 0.5 * mh * cos(tl);
          const hero = !!o.heroMug && s > 0 && m.i === 1;
          MUG(ctx, bx, by, mh, { fill: 0.88, foam: 1.12, logo: hero, tilt: tl, flip: ff < 0 ? !m.flip : m.flip, slosh, bubbles: true, t, line: o.line, width: R.ow * 0.8, seed: 'fan' + s + m.i });
        }
        drawHand(R, B, J['wr' + S], J['ha' + S], s, 'fist', st.skin, 500 + s, false, 1.0);
        out['fan' + S] = [c[0], c[1]];
      }
    } else if (carry === 'plate') {
      const c = R.m(J.hcR);
      const w = 30 * U;
      plateFood(ctx, c[0] + (flip ? 1 : -1) * w * 0.12, c[1] - 1.6 * U, w, o.plate || 'knuckle', o.line);
    }
    ctx.restore();
    // screen order: fanL is always the left one on screen
    return flip ? { fanL: out.fanR, fanR: out.fanL } : { fanL: out.fanL, fanR: out.fanR };
  }

  /** Resi's puffed sleeve, forearm and hand holding a plate, entering from the frame edge (shot 08).
   *  (x, y) is the plate centre; s = 1 makes the plate 300 px wide. o.from is the direction toward her
   *  shoulder in radians (0: the arm comes in from the right, PI: from the left); o.plate as waitress. */
  function serveArm(ctx, x, y, s, o) {
    o = o || {};
    s = num(s, 1);
    const alpha = o.alpha == null ? 1 : clamp(o.alpha);
    if (alpha <= 0) return;
    const from = num(o.from, 0);
    const B = Object.assign(waitressBody(), WAIT.resi.fig);
    const R = makeRig(ctx, x, y, 1000 * s, { line: o.line || 'secondary', draw: o.draw }, 'serveArm');
    const d = [cos(from), sin(from)];
    const hc = [d[0] * 4, 3.5];
    const wr = [hc[0] + d[0] * B.hand * 0.45, hc[1] + d[1] * B.hand * 0.45];
    const d2 = [cos(from + 0.12), sin(from + 0.12)];
    const el = [wr[0] + d2[0] * B.fore, wr[1] + d2[1] * B.fore];
    const d3 = [cos(from + 0.35), sin(from + 0.35)];
    const sh = [el[0] + d3[0] * B.upper, el[1] + d3[1] * B.upper];
    const st = { skin: skinOf(WAIT.resi.skin), sleeve: 'puff', sleeveColor: P.shirtWhite, hands: ['open', 'open'], back: false };
    const J = { shR: sh, elR: el, wrR: wr, haR: from + PI, chest: [sh[0] + d3[0] * 10, sh[1] + d3[1] * 10] };
    ctx.save();
    if (alpha < 1) ctx.globalAlpha *= alpha;
    drawArm(R, B, J, 1, st);
    plateFood(ctx, x, y, 300 * s, o.plate || 'knuckle', o.line);
    ctx.restore();
  }

  // ===========================================================================
  // tshirt, jerseyBack
  // ===========================================================================

  function tshirt(ctx, x, y, s, o) {
    o = o || {};
    s = num(s, 200);
    const alpha = o.alpha == null ? 1 : clamp(o.alpha);
    if (alpha <= 0 || s <= 0) return;
    const design = o.design === 'octo' ? 'octo' : 'jersey';
    const view = o.view === 'back' ? 'back' : 'front';
    const rot = num(o.rot, 0), fl = sin(num(o.flap, 0) * TAU);
    const LN = lineSet();
    const kind = o.line && LN.W[o.line] != null ? o.line : 'secondary';
    const ow = Math.max(1.5, (LN.W[kind] * (o.lineRef ? o.lineRef : s * 3)) / 800);
    const dw = Math.max(1.2, (LN.W.detail * (o.lineRef ? o.lineRef : s * 3)) / 800);
    const cr = cos(rot), sr = sin(rot);
    const M = (q) => [x + (q[0] * cr - q[1] * sr) * s, y + (q[0] * sr + q[1] * cr) * s];
    const MM = (list) => list.map(M);
    const col = design === 'jersey' ? P.fesbBlue : P.shirtWhite;
    const trim = design === 'jersey' ? COL.white : P.fesbBlue;
    const seed = L.hash('tee', design, view) % 5000;
    const draw = o.draw == null ? 1 : clamp(o.draw);
    const sh = (pts, fill, k, extra) => {
      const q = MM(pts);
      if (draw >= 1 && fill) rampFill(ctx, q, tone(fill, false), -sr, cr, Math.max(1.5, s * 0.02));
      if (!extra || extra.outline !== false) ink(ctx, q, { closed: true, width: (extra && extra.width) || ow, seed: seed + k, draw });
    };
    ctx.save();
    if (alpha < 1) ctx.globalAlpha *= alpha;
    for (const e of [-1, 1]) {
      const a = e * (0.28 * fl + (o.folded ? 0.5 : 0));
      const pv = [e * 0.29, -0.3];
      const rp = (q) => {
        const dx = q[0] - pv[0], dy = q[1] - pv[1];
        return [pv[0] + dx * cos(a) - dy * sin(a), pv[1] + dx * sin(a) + dy * cos(a)];
      };
      const sl = [[e * 0.27, -0.39], [e * 0.5, -0.27], [e * 0.43, -0.08], [e * 0.28, -0.14]].map(rp);
      sh(sl, col, 10 + e);
      const tr = [l2(sl[1], sl[2], 0), l2(sl[1], sl[2], 1), l2(sl[2], sl[3], 0.16), l2(sl[0], sl[1], 0.84)];
      sh(tr, trim, 12 + e, { width: ow * 0.6 });
    }
    const hemW = (u) => 0.018 * sin(num(o.flap, 0) * TAU + u * 7);
    const body = [[-0.3, -0.38], [-0.11, -0.42], [0, view === 'front' ? -0.33 : -0.39], [0.11, -0.42], [0.3, -0.38], [0.3, -0.1], [0.3, 0.2], [0.29, 0.42 + hemW(1)], [0.1, 0.43 + hemW(0.66)], [-0.1, 0.43 + hemW(0.33)], [-0.29, 0.42 + hemW(0)], [-0.3, 0.2], [-0.3, -0.1]];
    sh(body, col, 20);
    if (view === 'front') {
      const v = design === 'jersey' ? [[-0.12, -0.425], [0, -0.3], [0.12, -0.425], [0.09, -0.425], [0, -0.335], [-0.09, -0.425]] : [[-0.12, -0.425], [0, -0.32], [0.12, -0.425], [0.09, -0.425], [0, -0.345], [-0.09, -0.425]];
      sh(v, trim, 21, { width: ow * 0.6 });
    } else sh([[-0.12, -0.425], [0, -0.385], [0.12, -0.425], [0.1, -0.44], [0, -0.41], [-0.1, -0.44]], trim, 21, { width: ow * 0.6 });
    if (draw >= 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.translate(-x, -y);
      if (design === 'jersey' && view === 'front') {
        const Lg = logoCanvas(s * 0.13);
        const sc = (s * 0.13) / Lg.q;
        ctx.drawImage(Lg.c, x + 0.13 * s - Lg.q * 0.6 * sc, y - 0.2 * s - Lg.q * 0.6 * sc, Lg.q * 1.2 * sc, Lg.q * 1.2 * sc);
      } else if (design === 'jersey') jerseyPrint(ctx, x, y + 0.02 * s, s * 0.36, s * 0.36, 0);
      else if (view === 'front') {
        const O = octoCanvas(s * 0.46);
        const sc = (s * 0.46) / O.q;
        ctx.drawImage(O.c, x - O.q * 0.65 * sc, y - 0.05 * s - O.q * 0.55 * sc, O.q * 1.3 * sc, O.q * 1.1 * sc);
      } else {
        const Lg = logoCanvas(s * 0.09);
        const sc = (s * 0.09) / Lg.q;
        ctx.drawImage(Lg.c, x - Lg.q * 0.6 * sc, y - 0.28 * s - Lg.q * 0.6 * sc, Lg.q * 1.2 * sc, Lg.q * 1.2 * sc);
      }
      ctx.restore();
      ink(ctx, MM([[-0.08, 0.1 + fl * 0.02], [0.02, 0.2], [0.18, 0.18 - fl * 0.02]]), { width: dw, color: P.outline, alpha: 0.35, seed: seed + 30 });
    }
    ctx.restore();
  }

  function jerseyBack(ctx, x, y, w, o) {
    o = o || {};
    w = num(w, 300);
    const alpha = o.alpha == null ? 1 : clamp(o.alpha);
    if (alpha <= 0 || w <= 0) return;
    ctx.save();
    if (alpha < 1) ctx.globalAlpha *= alpha;
    jerseyPrint(ctx, x, y, w, w, clamp(num(o.gleam, 0)));
    ctx.restore();
  }

  FILM.cast = { TEAM, CHEF_TALL, person, chef, chefHand, chefBeardEdge, waitress, serveArm, tshirt, jerseyBack };
})();

<script>
// ---- src/scenes/01-office-night.js
/*
 * Shot 01 'office-night' — T 0.0 to 2.0 (global), illustrated.
 * The FESB office at night: a window wall of city lights at the back, three desks in a row at
 * middle depth, a big central monitor running a test suite that turns green row by row, two
 * teammates (TEAM[0], TEAM[3]) seen from behind at their desks. Slow push-in on the monitor.
 *
 * Layers, back to front:
 *   1. Night sky / office wash
 *   2. Window wall with city lights
 *   3. Big central monitor (bezel, glow, 8 test rows, stand + FESB sticker)
 *   4. Three desks (officeDesk), with a laptop, coffee mug and sticky notes
 *   5. Two teammates from behind, seated at their desks (waist up)
 *
 * Everything but the camera push lives inside FILM.lib.camera; there is no screen-fixed overlay.
 */
(function () {
  'use strict';
  const ID = 'office-night';
  const TAU = Math.PI * 2;
  const FR = 1 / 24;

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const props = FILM.props, cast = FILM.cast;
      const LINE = props.LINE;
      const clamp = L.clamp, lerp = L.lerp, E = L.ease;
      const t = clamp(tIn, 0, info.dur);
      const W = info.W, H = info.H;

      const sd = (...k) => L.hash(ID, ...k) & 0x7fffffff;

      // ---- local ink helper: closed shapes go through props.shape (LINE baked in); open
      // strokes go through lib.inkPath directly with LINE spread in. ----
      const ink = (pts, o = {}) =>
        L.inkPath(ctx, pts, Object.assign(
          { wobble: LINE.wobble, tremble: LINE.tremble, rough: LINE.rough, boilAmp: LINE.boilAmp, widthJitter: LINE.widthJitter, taper: LINE.taperOpen },
          o
        ));

      // pop-in helper: 0 before `a`, then an eased ramp over `frames` frames, visible ON the beat
      // frame itself (lead = 1), holding at 1 after — see reference/scene-anatomy.md.
      const hit = (a, frames = 3, e = E.outBack, lead = 1) =>
        t < a ? 0 : e(clamp((t - a) / (frames * FR) + lead / frames));

      // ===========================================================================
      // 1. Background wash
      // ===========================================================================
      ctx.save();
      ctx.fillStyle = P.officeNight;
      ctx.fillRect(0, 0, W, H);
      // a very subtle vertical gloom gradient, floor a touch darker
      const bgG = ctx.createLinearGradient(0, 0, 0, H);
      bgG.addColorStop(0, L.rgba(P.officeNight, 0));
      bgG.addColorStop(1, L.rgba('#05070F', 0.55));
      ctx.fillStyle = bgG;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();

      // Camera: static wide, slow push-in on the monitor centre over the whole shot.
      const MX0 = 700, MY0 = 260, MX1 = 1220, MY1 = 700;
      const monCx = (MX0 + MX1) / 2, monCy = (MY0 + MY1) / 2;
      const zoom = lerp(1.0, 1.06, clamp(t / info.dur));

      L.camera(ctx, { x: monCx, y: monCy, zoom }, () => {
        // ===========================================================================
        // 2. Window wall, city lights (background, y 0..250)
        // ===========================================================================
        (function windowWall() {
          ctx.save();
          const wy0 = 20, wy1 = 240;
          ctx.fillStyle = L.mix(P.officeNight, '#05060D', 0.4);
          ctx.fillRect(0, 0, W, wy1 + 30);
          const cols = 30;
          const cw = W / cols;
          for (let i = 0; i < cols; i++) {
            const h3 = L.h3(sd('win'), i, 1);
            if (h3 < 0.28) continue; // some windows dark
            const wx = i * cw + cw * 0.18;
            const ww = cw * 0.64;
            const rows = L.h3(sd('win'), i, 2) < 0.5 ? 2 : 3;
            const warm = L.h3(sd('win'), i, 3) < 0.6;
            const baseCol = warm ? P.bulb : P.screenGlow;
            const flick = 0.85 + 0.15 * Math.sin(t * (1.3 + h3) + i * 2.1);
            for (let r = 0; r < rows; r++) {
              const wh = (wy1 - wy0) / 3.4;
              const wyy = wy0 + r * (wh + 10);
              const a = (0.1 + 0.22 * L.h3(sd('win'), i, r + 10)) * flick;
              ctx.fillStyle = L.rgba(baseCol, a);
              ctx.fillRect(wx, wyy, ww, wh);
            }
          }
          // faint horizon glow
          const hg = ctx.createLinearGradient(0, wy1 - 40, 0, wy1 + 40);
          hg.addColorStop(0, L.rgba(P.bulb, 0.06));
          hg.addColorStop(1, L.rgba(P.bulb, 0));
          ctx.fillStyle = hg;
          ctx.fillRect(0, wy1 - 40, W, 80);
          ctx.restore();
        })();

        // ===========================================================================
        // 3. Big central monitor
        // ===========================================================================
        (function monitor() {
          const bw = MX1 - MX0, bh = MY1 - MY0;
          // soft glow behind the monitor
          ctx.save();
          const glowR = Math.max(bw, bh) * 0.75;
          const glow = ctx.createRadialGradient(monCx, monCy, 10, monCx, monCy, glowR);
          const pulse = 0.85 + 0.15 * Math.sin(t * 1.6);
          glow.addColorStop(0, L.rgba(P.screenGlow, 0.28 * pulse));
          glow.addColorStop(1, L.rgba(P.screenGlow, 0));
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(monCx, monCy, glowR, 0, TAU);
          ctx.fill();
          ctx.restore();

          // bezel
          const bez = L.rrectPts(MX0, MY0, bw, bh, 22, 20);
          const bezG = ctx.createLinearGradient(MX0, MY0, MX1, MY1);
          bezG.addColorStop(0, L.mix(P.officeDesk, P.gloss, 0.08));
          bezG.addColorStop(1, L.mix(P.officeDesk, '#000', 0.25));
          props.shape(ctx, bez, {
            fill: bezG, width: LINE.W.hero, color: P.outline, seed: sd('bezel'),
            gloss: [[MX0 + bw * 0.14, MY0 + bh * 0.1, bw * 0.22, 0.35, 5]],
          });

          // screen, inset
          const inset = 18;
          const sx0 = MX0 + inset, sy0 = MY0 + inset, sx1 = MX1 - inset, sy1 = MY1 - inset;
          const scrPts = L.rrectPts(sx0, sy0, sx1 - sx0, sy1 - sy0, 10, 16);
          ctx.save();
          ctx.beginPath();
          L.tracePath(ctx, scrPts, true);
          ctx.closePath();
          const scrG = ctx.createLinearGradient(sx0, sy0, sx0, sy1);
          scrG.addColorStop(0, '#0A0E1E');
          scrG.addColorStop(1, '#050711');
          ctx.fillStyle = scrG;
          ctx.fill();
          ctx.clip();

          // 8 test rows
          const rows = 8, gap = 8, mTop = 14, mBot = 14, mSide = 20;
          const rowsH = (sy1 - sy0) - mTop - mBot;
          const rowH = (rowsH - (rows - 1) * gap) / rows;
          const barX0 = sx0 + mSide + rowH * 1.15;
          const barX1 = sx1 - mSide;
          for (let k = 0; k < rows; k++) {
            const ry = sy0 + mTop + k * (rowH + gap);
            const cy = ry + rowH / 2;
            const cx = sx0 + mSide + rowH * 0.5;
            const a = 0.25 * k; // beat time, global T == local t here (shot starts at T 0)

            // code-line bar (static placeholder, no literal text)
            const barH = Math.max(6, rowH * 0.42);
            const barPts = L.rrectPts(barX0, cy - barH / 2, barX1 - barX0, barH, barH / 2, 10);
            ctx.beginPath();
            L.tracePath(ctx, barPts, true);
            ctx.closePath();
            ctx.fillStyle = L.rgba(P.codeLine, 0.22 + 0.06 * L.h3(sd('rowlen'), k, 1));
            ctx.fill();
            // a shorter accent segment for variety
            const segW = (barX1 - barX0) * lerp(0.3, 0.7, L.h3(sd('rowlen'), k, 2));
            ctx.fillStyle = L.rgba(P.codeLine, 0.14);
            ctx.fillRect(barX0, cy + barH / 2 + 3, segW, Math.max(2, barH * 0.28));

            // base grey circle (always present)
            const rad = rowH * 0.36;
            ctx.beginPath();
            ctx.arc(cx, cy, rad, 0, TAU);
            ctx.fillStyle = L.mix(P.officeDesk, P.gloss, 0.12);
            ctx.fill();
            ctx.lineWidth = Math.max(1.5, rad * 0.18);
            ctx.strokeStyle = L.rgba(P.outline, 0.7);
            ctx.stroke();

            // pass state: green fill + white tick, popping with outBack
            const pop = hit(a, 3);
            if (pop > 0.002) {
              ctx.save();
              ctx.translate(cx, cy);
              ctx.scale(pop, pop);
              ctx.beginPath();
              ctx.arc(0, 0, rad, 0, TAU);
              const pg = ctx.createRadialGradient(-rad * 0.3, -rad * 0.35, rad * 0.15, 0, 0, rad);
              pg.addColorStop(0, L.mix(P.pass, P.gloss, 0.45));
              pg.addColorStop(1, P.pass);
              ctx.fillStyle = pg;
              ctx.fill();
              ctx.strokeStyle = P.outline;
              ctx.lineWidth = Math.max(1.3, rad * 0.14);
              ctx.stroke();
              // tick
              ctx.strokeStyle = P.gloss;
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.lineWidth = Math.max(1.6, rad * 0.26);
              ctx.beginPath();
              ctx.moveTo(-rad * 0.42, 0.02 * rad);
              ctx.lineTo(-rad * 0.1, rad * 0.36);
              ctx.lineTo(rad * 0.48, -rad * 0.38);
              ctx.stroke();
              ctx.restore();
            }
          }
          ctx.restore(); // clip

          // monitor stand + FESB sticker
          const standW = 160, standTop = MY1, standBot = MY1 + 58;
          props.shape(ctx, [
            [monCx - standW * 0.22, standTop], [monCx + standW * 0.22, standTop],
            [monCx + standW * 0.5, standBot], [monCx - standW * 0.5, standBot],
          ], { fill: L.mix(P.officeDesk, '#000', 0.2), width: LINE.W.secondary, color: P.outline, seed: sd('stand') });
          props.fesbLogo(ctx, monCx, standTop + 26, 34, { outline: true });
        })();

        // ===========================================================================
        // 4 + 5. Desks and the two teammates
        // ===========================================================================
        const deskTop = 800, deskBot = 962;
        const deskW = 380, deskGap = 40;
        const deskX0 = (W - (deskW * 3 + deskGap * 2)) / 2;
        const deskCX = [deskX0 + deskW / 2, deskX0 + deskW * 1.5 + deskGap, deskX0 + deskW * 2.5 + deskGap * 2];

        function desk(cx, hasPerson, seedK) {
          const x0 = cx - deskW / 2, x1 = cx + deskW / 2;
          // chair back, behind the desk edge
          if (hasPerson) {
            const chW = deskW * 0.34;
            props.shape(ctx, L.rrectPts(cx - chW / 2, deskTop - 168, chW, 150, 16, 10), {
              fill: L.mix(P.officeDesk, '#000', 0.12), width: LINE.W.secondary, color: P.outline, seed: sd('chair', seedK),
            });
          }
          // desk front panel
          const panelG = ctx.createLinearGradient(x0, deskTop, x0, deskBot);
          panelG.addColorStop(0, L.mix(P.officeDesk, P.gloss, 0.12));
          panelG.addColorStop(1, L.mix(P.officeDesk, '#000', 0.3));
          props.shape(ctx, L.rrectPts(x0, deskTop, deskW, deskBot - deskTop, 14, 14), {
            fill: panelG, width: LINE.W.secondary, color: P.outline, seed: sd('desk', seedK),
            shade: { color: L.rgba('#000', 0.16), side: 'bottom', frac: 0.35 },
          });
          // desk top edge (thin highlight strip)
          props.shape(ctx, L.rrectPts(x0 - 6, deskTop - 12, deskW + 12, 16, 6, 10), {
            fill: L.mix(P.woodLight, P.officeDesk, 0.35), width: LINE.W.secondary, color: P.outline, seed: sd('deskTop', seedK),
          });
          // small laptop
          const lapX = cx - deskW * 0.28, lapY = deskTop - 12;
          props.shape(ctx, [[lapX - 46, lapY], [lapX + 46, lapY], [lapX + 40, lapY - 66], [lapX - 40, lapY - 66]], {
            fill: '#0B0E1A', width: LINE.W.detail, color: P.outline, seed: sd('lap', seedK),
          });
          ctx.save();
          ctx.fillStyle = L.rgba(P.codeLine, 0.5);
          for (let i = 0; i < 3; i++) ctx.fillRect(lapX - 30, lapY - 56 + i * 15, lerp(24, 52, L.h3(sd('lapcode', seedK), i, 1)), 5);
          ctx.restore();
          // coffee mug
          const mugX = cx + deskW * 0.3, mugY = deskTop - 16;
          props.shape(ctx, L.ellipsePts(mugX, mugY, 16, 20, 20), {
            fill: '#3A281C', width: LINE.W.detail, color: P.outline, seed: sd('mug', seedK), gloss: [[mugX - 5, mugY - 8, 6, 0.9, 3]],
          });
          ink([[mugX + 15, mugY - 6], [mugX + 25, mugY - 6], [mugX + 25, mugY + 4], [mugX + 15, mugY + 4]], { closed: false, width: LINE.W.detail, color: P.outline, seed: sd('mugh', seedK) });
          // sticky notes
          const notes = [P.confettiA, P.confettiC];
          for (let i = 0; i < notes.length; i++) {
            ctx.save();
            const nx = cx - deskW * 0.05 + i * 30, ny = deskTop - 20 - i * 4;
            ctx.translate(nx, ny);
            ctx.rotate((i === 0 ? -1 : 1) * 0.12);
            ctx.fillStyle = notes[i];
            ctx.fillRect(-14, -14, 28, 28);
            ctx.strokeStyle = L.rgba(P.outline, 0.6);
            ctx.lineWidth = 2;
            ctx.strokeRect(-14, -14, 28, 28);
            ctx.restore();
          }
        }

        desk(deskCX[0], true, 0);
        desk(deskCX[1], false, 1);
        desk(deskCX[2], true, 2);

        cast.person(ctx, cast.TEAM[0], deskCX[0], deskTop + 18, 520, { name: 'back' }, { upper: true, outfit: 'casual' });
        cast.person(ctx, cast.TEAM[3], deskCX[2], deskTop + 18, 520, { name: 'back' }, { upper: true, outfit: 'casual' });
      });
    },
  });
})();

</script>
<script>
// ---- src/scenes/02-deploy.js
/*
 * Shot 02 'deploy' — T 2.0 to 4.0 (global), illustrated, cut in.
 * Close-up on the dark console: the chef's hand descends from the top of frame and presses the
 * glossy pass-green DEPLOY button at T 2.5 (beat, local t 0.5). A white ring bursts, confetti
 * flies, the out-of-focus monitor behind flips to "FESB 9 (check)", and the caption
 * "Релиз FESB 9" pops at T 3.0 (local t 1.0). Only the chef's hand and chin edge are ever shown.
 *
 * Layers, back to front:
 *   1. Dark console wash
 *   2. Out-of-focus monitor (soft placeholder bars -> crisp "FESB 9" pass check)
 *   3. DEPLOY button (squash on the press) + white ring burst
 *   4. The chef's hand descending and pressing
 *   5. The chef's chin / beard edge, top of frame
 *   6. Confetti
 *   7. Caption "Релиз FESB 9" (screen-fixed, on top)
 */
(function () {
  'use strict';
  const ID = 'deploy';
  const TAU = Math.PI * 2;
  const FR = 1 / 24;

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const props = FILM.props, cast = FILM.cast;
      const LINE = props.LINE;
      const clamp = L.clamp, lerp = L.lerp, E = L.ease;
      const t = clamp(tIn, 0, info.dur);
      const W = info.W, H = info.H;

      const sd = (...k) => L.hash(ID, ...k) & 0x7fffffff;
      const hit = (a, frames = 3, e = E.outBack, lead = 1) =>
        t < a ? 0 : e(clamp((t - a) / (frames * FR) + lead / frames));

      const BX = 960, BY = 700, BR = 150; // DEPLOY button, storyboard exact
      const B_PRESS = 0.5; // local t == global T 2.5

      // ===========================================================================
      // 1. Dark console wash
      // ===========================================================================
      ctx.save();
      const bgG = ctx.createRadialGradient(BX, BY - 100, 40, BX, BY - 100, 1300);
      bgG.addColorStop(0, '#141A2E');
      bgG.addColorStop(1, '#05070D');
      ctx.fillStyle = bgG;
      ctx.fillRect(0, 0, W, H);
      // a soft wash of room light spilling down from above, so the chef's dark beard silhouettes
      // against it instead of vanishing into the console's own near-black navy
      const topG = ctx.createLinearGradient(0, 0, 0, 330);
      topG.addColorStop(0, L.rgba(L.mix(P.officeDesk, P.gloss, 0.18), 0.9));
      topG.addColorStop(1, L.rgba(P.officeDesk, 0));
      ctx.fillStyle = topG;
      ctx.fillRect(0, 0, W, 330);
      ctx.restore();

      // camera: static, 4% kick-zoom on the press, settling over 6 frames (outCubic decay)
      const kzP = t < B_PRESS ? 0 : clamp((t - B_PRESS) / (6 * FR));
      const kz = t < B_PRESS ? 0 : 0.04 * (1 - E.outCubic(kzP));

      L.camera(ctx, { x: BX, y: BY, zoom: 1 + kz }, () => {
        // ===========================================================================
        // 2. Out-of-focus monitor behind, flips to FESB 9 check on the press
        // ===========================================================================
        (function monitor() {
          // offset to the right of the button/hand/beard column, so the hand resting on the
          // button through the rest of the shot never hides the "FESB 9" flip behind it
          const mx0 = 1080, my0 = 300, mx1 = 1620, my1 = 520;
          const mcx = (mx0 + mx1) / 2, mcy = (my0 + my1) / 2;
          // soft unfocused glow standing in for the blurred monitor (art bible: no blur filter)
          ctx.save();
          const g = ctx.createRadialGradient(mcx, mcy, 20, mcx, mcy, 520);
          g.addColorStop(0, L.rgba(P.screenGlow, 0.16));
          g.addColorStop(1, L.rgba(P.screenGlow, 0));
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(mcx, mcy, 520, 0, TAU);
          ctx.fill();
          ctx.restore();

          const flipK = t < B_PRESS ? 0 : clamp((t - B_PRESS) / (6 * FR) + 1 / 6);
          // pre-press: a few very soft, low-contrast bars (an out-of-focus code screen)
          if (flipK < 1) {
            ctx.save();
            ctx.globalAlpha = 0.35 * (1 - E.outCubic(flipK));
            for (let i = 0; i < 4; i++) {
              const yy = my0 + 40 + i * 42;
              ctx.fillStyle = L.rgba(P.codeLine, 0.5);
              ctx.beginPath();
              ctx.ellipse(mcx - 40 + i * 18, yy, 210 - i * 14, 12, 0, 0, TAU);
              ctx.fill();
            }
            ctx.restore();
          }
          // post-press: the monitor sharpens and flips to a big pass check
          if (flipK > 0) {
            const pop = E.outBack(flipK);
            ctx.save();
            ctx.globalAlpha = clamp(flipK * 2);
            ctx.translate(mcx, mcy);
            ctx.scale(1, clamp(pop, 0.05, 1.15));
            ctx.translate(-mcx, -mcy);
            const bez = L.rrectPts(mx0, my0, mx1 - mx0, my1 - my0, 18, 16);
            props.shape(ctx, bez, { fill: '#0A0E1E', width: LINE.W.secondary, color: P.outline, seed: sd('mon') });
            L.text(ctx, 'FESB 9', mcx - 24, mcy + 24, { size: 92, weight: 900, align: 'center', color: P.pass, family: '"Montserrat","DejaVu Sans",sans-serif' });
            // hand-drawn tick, echoing the test-row ticks of shot 01
            const tx = mcx + 190, ty = mcy;
            ctx.strokeStyle = P.pass;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.moveTo(tx - 26, ty + 2);
            ctx.lineTo(tx - 6, ty + 24);
            ctx.lineTo(tx + 30, ty - 26);
            ctx.stroke();
            ctx.restore();
          }
        })();

        // ===========================================================================
        // 3. DEPLOY button, squash on the press, ring burst
        // ===========================================================================
        (function button() {
          // 12% squash for 2 frames, a half-sine bump centred on the press
          const dt = t - B_PRESS;
          const w = 2 * FR;
          const squash = dt >= 0 && dt < w ? 0.12 * Math.sin(Math.PI * (dt / w)) : 0;
          ctx.save();
          ctx.translate(BX, BY);
          ctx.scale(1 + squash * 0.45, 1 - squash);
          ctx.translate(-BX, -BY);
          const pts = L.ellipsePts(BX, BY, BR, BR, 80);
          const bg = ctx.createRadialGradient(BX - BR * 0.35, BY - BR * 0.4, BR * 0.15, BX, BY, BR * 1.05);
          bg.addColorStop(0, L.mix(P.pass, P.gloss, 0.5));
          bg.addColorStop(0.55, P.pass);
          bg.addColorStop(1, L.mix(P.pass, '#000', 0.35));
          props.shape(ctx, pts, {
            fill: bg, width: LINE.W.hero, color: P.outline, seed: sd('btn'),
            shade: { color: L.rgba('#000', 0.18), side: 'bottom', frac: 0.3 },
            gloss: [[BX - BR * 0.32, BY - BR * 0.42, BR * 0.5, -0.5, 26], [BX + BR * 0.2, BY - BR * 0.5, 0, 0, 14]],
          });
          L.text(ctx, 'DEPLOY', BX, BY + 20, { size: 58, weight: 900, align: 'center', color: '#0B3A22', family: '"Montserrat","DejaVu Sans",sans-serif' });
          ctx.restore();

          // white ring burst from the press
          if (t >= B_PRESS) {
            const ringP = clamp((t - B_PRESS) / 0.4);
            if (ringP < 1) {
              ctx.save();
              ctx.globalAlpha = 1 - ringP;
              ctx.strokeStyle = P.gloss;
              ctx.lineWidth = lerp(14, 2, ringP);
              ctx.beginPath();
              ctx.arc(BX, BY, lerp(BR, BR * 2.7, E.outCubic(ringP)), 0, TAU);
              ctx.stroke();
              ctx.restore();
            }
          }
        })();

        // ===========================================================================
        // 4. The chef's hand, descending and pressing
        // ===========================================================================
        (function hand() {
          const descP = clamp(t / B_PRESS);
          const fy = lerp(-90, BY - BR * 0.45, E.outQuad(Math.min(1, descP)));
          const fx = BX + 6;
          const pressAmt = t < B_PRESS ? 0 : clamp((t - B_PRESS) / (2 * FR));
          cast.chefHand(ctx, fx, fy, 1.5, { press: pressAmt, line: 'hero' });
        })();

        // ===========================================================================
        // 5. The chin edge, top of frame (only his chin and short beard, per art bible 10.1)
        // ===========================================================================
        cast.chefBeardEdge(ctx, 960, 190, 330, { line: 'hero' });

        // ===========================================================================
        // 6. Confetti, bursting from the button after the press
        // ===========================================================================
        props.confetti(ctx, sd('confetti'), t - B_PRESS, BX, BY - BR * 0.3, { count: 110, spread: 560, life: 3 });
      });

      // ===========================================================================
      // 7. Caption, screen-fixed, pops at T 3.0 (local t 1.0)
      // ===========================================================================
      const capT = 1.0;
      if (t >= capT) {
        const pop = clamp((t - capT) / (4 * FR) + 1 / 4);
        props.caption(ctx, 'Релиз FESB 9', 960, 880, 120, { align: 'center', style: 'split', pop });
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/03-release-beer.js
/*
 * Shot 03 'release-beer' — T 4.0 to 6.0 (global), illustrated, cut in.
 * The big office monitor fills the frame. A progress bar labelled "Загрузка праздника..." fills
 * with beer 0 -> 100% (local t 0..1). At 100% (t 1.0) it tips up on its right end and becomes a
 * beer column; the beer then surges up the whole frame and a foam head overflows from the top
 * until, by the last frame, the entire frame is foam — the handoff to 04.
 *
 * Layers, back to front:
 *   1. Monitor bezel + screen (the office monitor of shots 01-02, now filling the frame)
 *   2. The progress bar: label, percentage, track, beer fill, foam cap, bubbles, tick gauge
 *   3. The bar's 90-degree tip about its right end (t >= 1.0)
 *   4. The full-frame flood: beer rises to cover the frame, then foam overflows from the top
 *      down until it covers everything
 */
(function () {
  'use strict';
  const ID = 'release-beer';
  const TAU = Math.PI * 2;
  const FR = 1 / 24;
  const FONT = '"Montserrat", "DejaVu Sans", sans-serif'; // Cyrillic-safe, matches FILM.props.caption

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const props = FILM.props;
      const LINE = props.LINE;
      const clamp = L.clamp, lerp = L.lerp, E = L.ease;
      const t = clamp(tIn, 0, info.dur);
      const W = info.W, H = info.H;

      const sd = (...k) => L.hash(ID, ...k) & 0x7fffffff;
      const ink = (pts, o = {}) =>
        L.inkPath(ctx, pts, Object.assign(
          { wobble: LINE.wobble, tremble: LINE.tremble, rough: LINE.rough, boilAmp: LINE.boilAmp, widthJitter: LINE.widthJitter, taper: LINE.taperOpen },
          o
        ));

      // ===========================================================================
      // 1. Monitor bezel + screen, full frame (art bible 10.7)
      // ===========================================================================
      const MX0 = 120, MY0 = 90, MX1 = 1800, MY1 = 990;
      ctx.save();
      ctx.fillStyle = '#05070D';
      ctx.fillRect(0, 0, W, H);
      const bez = L.rrectPts(MX0, MY0, MX1 - MX0, MY1 - MY0, 30, 24);
      const bezG = ctx.createLinearGradient(MX0, MY0, MX1, MY1);
      bezG.addColorStop(0, L.mix(P.officeDesk, P.gloss, 0.08));
      bezG.addColorStop(1, L.mix(P.officeDesk, '#000', 0.28));
      props.shape(ctx, bez, { fill: bezG, width: LINE.W.hero, color: P.outline, seed: sd('bezel') });
      const inset = 22;
      const sx0 = MX0 + inset, sy0 = MY0 + inset, sx1 = MX1 - inset, sy1 = MY1 - inset;
      const scr = L.rrectPts(sx0, sy0, sx1 - sx0, sy1 - sy0, 14, 20);
      ctx.save();
      ctx.beginPath();
      L.tracePath(ctx, scr, true);
      ctx.closePath();
      ctx.clip();
      const scrG = ctx.createLinearGradient(0, sy0, 0, sy1);
      scrG.addColorStop(0, '#0A0E1E');
      scrG.addColorStop(1, '#050711');
      ctx.fillStyle = scrG;
      ctx.fillRect(sx0, sy0, sx1 - sx0, sy1 - sy0);
      // faint ambient glow, screen centre
      const glow = ctx.createRadialGradient(960, 540, 40, 960, 540, 900);
      glow.addColorStop(0, L.rgba(P.screenGlow, 0.1));
      glow.addColorStop(1, L.rgba(P.screenGlow, 0));
      ctx.fillStyle = glow;
      ctx.fillRect(sx0, sy0, sx1 - sx0, sy1 - sy0);

      // ===========================================================================
      // 2 + 3. Progress bar (phase A: fill 0->100%; phase B from t=1.0: tips 90 deg)
      // ===========================================================================
      const BX0 = 360, BY0 = 480, BX1 = 1560, BY1 = 600;
      const barW = BX1 - BX0, barH = BY1 - BY0;
      const pivotX = BX1, pivotY = (BY0 + BY1) / 2;
      const pctA = clamp(t / 1.0);
      const tipK = t < 1.0 ? 0 : clamp((t - 1.0) / (6 * FR));
      const tipAngle = -(Math.PI / 2) * E.outBack(tipK);

      ctx.save();
      ctx.translate(pivotX, pivotY);
      ctx.rotate(tipAngle);
      ctx.translate(-pivotX, -pivotY);

      // label + percentage (fade out once the tip begins, they've done their job)
      const uiAlpha = t < 1.0 ? 1 : clamp(1 - (t - 1.0) / (3 * FR));
      if (uiAlpha > 0.01) {
        ctx.save();
        ctx.globalAlpha = uiAlpha;
        L.text(ctx, 'Загрузка праздника…', (BX0 + BX1) / 2, BY0 - 40, {
          size: 56, weight: 800, align: 'center', color: '#F5F7FF', family: FONT,
        });
        const pct = Math.round(pctA * 100);
        L.text(ctx, pct + '%', BX1, BY0 - 40, { size: 52, weight: 800, align: 'right', color: P.beerLight, family: FONT });
        ctx.restore();
      }

      // track
      const trackPts = L.rrectPts(BX0, BY0, barW, barH, barH / 2, 14);
      ink(trackPts, { closed: true, width: LINE.W.hero, color: P.outline, seed: sd('track') });
      ctx.save();
      ctx.beginPath();
      L.tracePath(ctx, trackPts, true);
      ctx.closePath();
      ctx.fillStyle = L.rgba('#000', 0.35);
      ctx.fill();
      ctx.clip();

      // beer fill
      const fillX = BX0 + barW * pctA;
      if (pctA > 0.002) {
        const fg = ctx.createLinearGradient(0, BY0, 0, BY1);
        fg.addColorStop(0, P.beerLight);
        fg.addColorStop(1, P.beerDeep);
        ctx.fillStyle = fg;
        ctx.fillRect(BX0, BY0, fillX - BX0, barH);
        // carbonation, rising inside the fill
        ctx.save();
        ctx.beginPath();
        ctx.rect(BX0, BY0, fillX - BX0, barH);
        ctx.clip();
        for (let i = 0; i < 22; i++) {
          const r = L.rng(L.hash(sd('bub'), i));
          const bx = BX0 + r() * barW;
          if (bx > fillX) continue;
          const speed = lerp(60, 120, r());
          const travel = barH + 14;
          const by = BY1 - ((r() * travel + speed * t) % travel);
          const rad = lerp(2, 4.5, r());
          ctx.beginPath();
          ctx.arc(bx, by, rad, 0, TAU);
          ctx.fillStyle = L.rgba(P.gloss, 0.55);
          ctx.fill();
        }
        ctx.restore();
        // foam cap riding the leading edge
        const capR = barH * 0.62;
        ctx.beginPath();
        ctx.arc(fillX, BY0 + barH * 0.42, capR * 0.5, 0, TAU);
        ctx.fillStyle = P.foam;
        ctx.fill();
        ctx.strokeStyle = L.rgba(P.foamShade, 0.7);
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.restore(); // fill clip

      // gauge ticks at each 10%, flashing as the fill passes
      for (let i = 1; i <= 9; i++) {
        const tx = BX0 + barW * (i / 10);
        const a = i / 10; // local t at which the fill reaches this tick
        const flash = t < a ? 0 : E.outBack(clamp((t - a) / (3 * FR) + 1 / 3));
        ctx.save();
        ctx.strokeStyle = L.rgba(P.outline, 0.35 + 0.45 * clamp(flash));
        ctx.lineWidth = 2 + 2 * clamp(flash);
        ctx.beginPath();
        ctx.moveTo(tx, BY0 + 10);
        ctx.lineTo(tx, BY1 - 10);
        ctx.stroke();
        ctx.restore();
      }
      ctx.restore(); // tip rotation

      ctx.restore(); // screen clip
      ctx.restore(); // outer

      // ===========================================================================
      // 4. Full-frame flood: beer surges up, then foam overflows top-down
      // ===========================================================================
      if (t >= 1.0) {
        const sBeer = clamp((t - 1.0) / 0.55);
        const beerTop = lerp(H + 40, -40, E.outCubic(sBeer));

        // a lumpy foam crown riding the rising beer surface (phase 1 flavour)
        const crownH = 70;
        const waveN = 10;
        const crownTop = [];
        for (let i = 0; i <= waveN; i++) {
          const x = lerp(0, W, i / waveN);
          const h3 = L.h3(sd('crown'), i, 0);
          const wob = Math.sin(t * 2.1 + i * 1.7 + h3 * TAU) * 10;
          crownTop.push([x, beerTop - crownH * 0.5 - crownH * 0.5 * h3 + wob]);
        }
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(0, H + 40);
        ctx.lineTo(0, crownTop[0][1]);
        for (const p of crownTop) ctx.lineTo(p[0], p[1]);
        ctx.lineTo(W, H + 40);
        ctx.closePath();
        const beerG = ctx.createLinearGradient(0, beerTop, 0, H);
        beerG.addColorStop(0, P.beerLight);
        beerG.addColorStop(1, P.beerDeep);
        ctx.fillStyle = beerG;
        ctx.fill();
        // carbonation across the flood
        for (let i = 0; i < 46; i++) {
          const r = L.rng(L.hash(sd('flood-bub'), i));
          const bx = r() * W;
          const speed = lerp(50, 110, r());
          const travel = H + 60;
          let by = H - ((r() * travel + speed * t) % travel);
          if (by < beerTop + 10) continue;
          ctx.beginPath();
          ctx.arc(bx, by, lerp(2.5, 6, r()), 0, TAU);
          ctx.fillStyle = L.rgba(P.gloss, 0.5);
          ctx.fill();
        }
        // foam crown cap along the wavy top
        ctx.beginPath();
        ctx.moveTo(0, crownTop[0][1]);
        for (const p of crownTop) ctx.lineTo(p[0], p[1]);
        for (let i = waveN; i >= 0; i--) ctx.lineTo(crownTop[i][0], crownTop[i][1] + crownH * 0.75);
        ctx.closePath();
        ctx.fillStyle = P.foam;
        ctx.fill();
        ctx.restore();

        // stage 2: foam overflow, growing from the top down until it covers the whole frame
        if (t >= 1.55) {
          const s2 = clamp((t - 1.55) / 0.45);
          const foamFront = lerp(0, H + 40, E.outCubic(s2));
          const waveN2 = 14;
          const edge = [];
          for (let i = 0; i <= waveN2; i++) {
            const x = lerp(0, W, i / waveN2);
            const h3 = L.h3(sd('foamEdge'), i, 1);
            const wob = Math.sin(t * 1.6 + i * 2.3 + h3 * TAU) * 22 * (1 - s2 * 0.6);
            edge.push([x, foamFront + wob * (s2 < 0.98 ? 1 : 0)]);
          }
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(0, -40);
          ctx.lineTo(0, edge[0][1]);
          for (const p of edge) ctx.lineTo(p[0], p[1]);
          ctx.lineTo(W, -40);
          ctx.closePath();
          ctx.fillStyle = P.foam;
          ctx.fill();
          // foam cel-shade blobs, static per seed, scattered through the covered area
          ctx.clip();
          for (let i = 0; i < 90; i++) {
            const r = L.rng(L.hash(sd('foamblob'), i));
            const bx = r() * W, by = r() * (foamFront + 80) - 40;
            const rad = lerp(10, 34, r());
            ctx.beginPath();
            ctx.arc(bx, by, rad, 0, TAU);
            ctx.fillStyle = L.rgba(P.foamShade, 0.5);
            ctx.fill();
          }
          for (let i = 0; i < 40; i++) {
            const r = L.rng(L.hash(sd('foambub'), i));
            const bx = r() * W, by = r() * (foamFront + 80) - 40;
            ctx.beginPath();
            ctx.arc(bx, by, lerp(2, 5, r()), 0, TAU);
            ctx.fillStyle = L.rgba(P.gloss, 0.6);
            ctx.fill();
          }
          ctx.restore();
        }
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/04-tap.js
// Shot 04 'tap' — illustrated, T 6.0-8.5 (global), shot-local t 0..2.5.
// Handoff: 03 -> 04 opens on a frame fully covered in foam (matches 03's last frame).
// Handoff: 04 -> 05 holds G1 (the hero mug: mug(ctx, 960, 900, 520, {...})) exactly on the last frame.
//
// Layers back to front:
//   1. hall background (counter variant): wall, beams, chandeliers, counter
//   2. bunting swag + bulb garland across the top
//   3. the brass tap (art bible 10.6) at (960, 190)
//   4. the hero Maß at G1, filling, with the FESB logo
//   5. glass ping sparkle (T 8.0) + a few ambient golden bubbles
//   6. the receding full-frame foam curtain (T 6.0 -> 7.0), drawn last so it covers everything below it
//   7. caption "2 октября" / "Spaten House" (T 7.0), screen-fixed, outside the camera push-in
(function () {
  'use strict';

  const FILM = window.FILM;
  const L = FILM.lib;
  const P = L.pal;
  const TAU = Math.PI * 2;
  const FR = 1 / 24;
  const ID = 'tap';

  // every seed in this file derives from the shot id
  const sd = (...k) => L.hash(ID, ...k) & 0x7fffffff;

  /**
   * drawFoamCurtain(ctx, edgeY, t) : the sea of foam covering the frame below `edgeY`, with a wobbly
   * scalloped top edge and a bubble-cell texture, plus a scatter of small bubbles popping off the edge
   * and drifting up. Pure function of (edgeY, t); edgeY is the world y above which the frame is clear.
   */
  function drawFoamCurtain(ctx, edgeY, t) {
    const W = FILM.W, H = FILM.H;
    if (edgeY > H + 220) return;
    const n = 36;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const x = (W * i) / n;
      const w1 = Math.sin(x * 0.0055 + t * 1.35) * 30;
      const w2 = Math.sin(x * 0.021 - t * 2.05 + i * 0.7) * 14;
      const j = (L.h3(i, 3, sd('foamJ')) - 0.5) * 22;
      pts.push([x, edgeY + w1 + w2 + j]);
    }
    const bottom = H + 240;
    const path = new Path2D();
    path.moveTo(0, Math.max(-80, pts[0][1]));
    for (const [x, y] of pts) path.lineTo(x, Math.max(-80, y));
    path.lineTo(W, bottom);
    path.lineTo(0, bottom);
    path.closePath();
    ctx.save();
    const g = ctx.createLinearGradient(0, edgeY - 60, 0, edgeY + 260);
    g.addColorStop(0, P.foam);
    g.addColorStop(1, P.foamShade);
    ctx.fillStyle = g;
    ctx.fill(path);
    ctx.save();
    ctx.clip(path);
    const cols = 30, rows = 9;
    for (let cx = 0; cx < cols; cx++) {
      const x = (W * (cx + 0.5)) / cols;
      const cs = sd('foamCell', cx);
      for (let ry = 0; ry < rows; ry++) {
        const y = edgeY - 50 + ry * 68 + (L.h3(cx, ry, cs) - 0.5) * 28;
        if (y < edgeY - 260 || y > bottom + 40) continue;
        const r = 24 + L.h3(cx, ry, cs + 1) * 20;
        ctx.beginPath();
        ctx.fillStyle = (ry + cx) % 2 === 0 ? P.foam : P.foamShade;
        ctx.globalAlpha = 0.5;
        ctx.arc(x, y, r, 0, TAU);
        ctx.fill();
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = L.rgba(P.foamShade, 0.7);
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (const [x, y] of pts) ctx.lineTo(x, y);
    ctx.stroke();
    ctx.strokeStyle = L.rgba(P.gloss, 0.35);
    ctx.lineWidth = 1.6;
    ctx.stroke();
    // bubbles popping off the drained edge and drifting up
    for (let i = 0; i < 26; i++) {
      const cs = sd('pop', i);
      const px = L.h3(i, 1, cs) * W;
      const cycle = 0.55 + L.h3(i, 2, cs) * 0.5;
      const phase = L.h3(i, 3, cs);
      const local = ((t / cycle + phase) % 1 + 1) % 1;
      const py = edgeY - local * 95;
      if (py < -20 || py > H + 20) continue;
      const alpha = (1 - local) * 0.85;
      const r2 = 3 + L.h3(i, 4, cs) * 6;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = P.foam;
      ctx.beginPath();
      ctx.arc(px, py, r2, 0, TAU);
      ctx.fill();
      ctx.fillStyle = P.gloss;
      ctx.beginPath();
      ctx.arc(px - r2 * 0.3, py - r2 * 0.3, Math.max(0.6, r2 * 0.3), 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);
      const dur = info.dur;
      const W = FILM.W, H = FILM.H;
      const Tg = info.T;

      // --- timing (local t: 0 = T 6.0, 1.0 = T 7.0, 2.0 = T 8.0, 2.5 = T 8.5) ---
      const drainP = L.clamp(t / 1.0);                    // T 6.0 -> 7.0: the curtain drains
      const pourP = L.clamp((t - 1.0) / 1.0);              // T 7.0 -> 8.0: the last pour
      const closeP = L.clamp((t - 2.0) / 0.5);             // T 8.0 -> 8.5: tap closes, settles

      const fill = L.lerp(0.55, 0.88, L.clamp(t / 2.0));
      let foamAmt;
      if (t < 1.0) foamAmt = L.lerp(0.5, 0.62, L.ease.outSine(drainP));
      else if (t < 2.0) foamAmt = L.lerp(0.62, 1.32, L.ease.outSine(pourP));
      else foamAmt = L.lerp(1.32, 1.0, L.ease.outCubic(closeP));

      let flow;
      if (t < 1.0) flow = 0;
      else if (t < 1.0 + 3 * FR) flow = L.clamp((t - 1.0) / (3 * FR));
      else if (t < 2.0) flow = 1;
      else flow = L.lerp(1, 0, L.clamp(closeP / 0.55));
      const pull = flow;

      const camP = L.ease.outCubic(L.clamp(t / dur));
      const zoom = L.lerp(0.97, 1.0, camP);

      // 1-5: hall, bunting, garland, tap, mug, sparkle, ambient bubbles — under the push-in
      L.camera(ctx, { x: W / 2, y: H / 2, zoom }, () => {
        FILM.props.hallBack(ctx, { variant: 'counter', t: Tg, dim: 0 });
        FILM.props.bunting(ctx, 40, 120, 1880, 120, 70, { t: Tg, seed: sd('bunt') });
        FILM.props.garland(ctx, 70, 236, 1850, 236, 40, { t: Tg, glow: 1, seed: sd('gar') });
        FILM.props.tap(ctx, 960, 190, 300, { flow, flowTo: 335, pull, t: Tg, seed: sd('tap') });
        FILM.props.mug(ctx, 960, 900, 520, {
          fill, foam: foamAmt, logo: true, bubbles: true, t: Tg, line: 'hero', seed: sd('mug'),
        });
        if (t >= 2.0 && t < 2.5) FILM.props.sparkle(ctx, 905, 425, 62, L.clamp((t - 2.0) / 0.5));
        FILM.props.bubbles(ctx, sd('amb'), Tg, { x: 220, y: 210, w: 1480, h: 600 }, { count: 7, speed: 0.5, size: [5, 12], alpha: 0.35 });
        // 6: the receding foam curtain, drawn last so it covers everything beneath while draining
        if (drainP < 1) drawFoamCurtain(ctx, L.lerp(0, H + 260, L.ease.inOutCubic(drainP)), Tg);
      });

      // 7: caption, screen-fixed (never rides the camera), pops on T 7.0
      if (t >= 1.0) {
        const pop = L.clamp((t - 1.0) / (4 * FR));
        FILM.props.caption(ctx, '2 октября', 180, 760, 110, { align: 'left', style: 'white', pop });
        FILM.props.caption(ctx, 'Spaten House', 180, 880, 96, { align: 'left', style: 'gold', pop });
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/05-bp-message.js
// Shot 05 'bp-message' — schematic (blueprint), T 8.5-10.0 (global), shot-local t 0..1.5.
// Match cut: the hero mug stays on the exact G1 pixels (mug(ctx, 960, 900, 520, {...})) as 04 hands off
// from its illustrated render to this blueprint line art; the mug is fully present on frame 0.
//
// Layers back to front:
//   1. lib.blueprint plate
//   2. the hero mug at G1, double-outline blueprint line art (art bible section 5)
//   3. heading "Сообщение создано" + the small FESB line logo (top-right)
//   4. three labels with leader lines (payload / header / id), drawn on one per 8th from T 8.75
//   5. a queue of three message boxes on the right; the lit one slides a slot at T 9.5 with a teal tick
(function () {
  'use strict';

  const FILM = window.FILM;
  const L = FILM.lib;
  const P = L.pal;
  const TAU = Math.PI * 2;
  const FR = 1 / 24;
  const ID = 'bp-message';

  const sd = (...k) => L.hash(ID, ...k) & 0x7fffffff;

  /** A schematic "message" rectangle centred at (x, y): primary double outline (art bible section 5). */
  function msgBox(ctx, x, y, w, h, o) {
    o = o || {};
    const gap = o.gap != null ? o.gap : 8;
    const x0 = x - w / 2, y0 = y - h / 2;
    ctx.save();
    if (o.fillAlpha > 0) {
      ctx.globalAlpha = o.fillAlpha;
      ctx.fillStyle = o.fill || P.schemBeer;
      ctx.fillRect(x0 + gap, y0 + gap, w - 2 * gap, h - 2 * gap);
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = L.rgba(P.lineWhite, 0.85);
    ctx.lineWidth = 3;
    ctx.strokeRect(x0, y0, w, h);
    ctx.strokeStyle = L.rgba(P.paleBlue, 0.5);
    ctx.lineWidth = 2;
    ctx.strokeRect(x0 + gap, y0 + gap, w - 2 * gap, h - 2 * gap);
    ctx.restore();
  }

  /** A short paleBlue leader line from a target point (tx, ty), drawing on to (lx, ly) as p goes 0..1. */
  function leader(ctx, tx, ty, lx, ly, p) {
    if (p <= 0) return;
    const ex = L.lerp(tx, lx, L.ease.outCubic(p));
    const ey = L.lerp(ty, ly, L.ease.outCubic(p));
    ctx.save();
    ctx.strokeStyle = L.rgba(P.paleBlue, 0.65);
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.fillStyle = L.rgba(P.schemBeer, 0.9);
    ctx.beginPath();
    ctx.arc(tx, ty, 4.5, 0, TAU);
