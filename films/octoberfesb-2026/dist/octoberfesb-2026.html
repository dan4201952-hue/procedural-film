    ctx.fill();
    ctx.restore();
  }

  /**
   * A translucent schemBeer overlay inside the hero mug's glass at G1, on top of props.mug's own
   * blueprint fill, so the beer reads as liquid (tint + bright surface line + a few bubbles) rather
   * than a flat block. Geometry mirrors the Maß (art bible 10.4): base centre (960, 900), height 520.
   */
  function beerGlow(ctx, cx, baseY, h, fill, seed) {
    const u = h / 100;
    const hwB = 34.6, hwT = 32.7, wall = 3.2, base = 12;
    const innerHalf = (ly) => (hwB + (hwT - hwB) * (-ly / 100) - wall) * u;
    const surfLy = -(base + fill * (100 - base));
    const baseLy = -base;
    const steps = 10;
    const path = new Path2D();
    for (let i = 0; i <= steps; i++) {
      const ly = L.lerp(surfLy, baseLy, i / steps);
      const y = baseY + u * ly, hw = innerHalf(ly);
      if (i) path.lineTo(cx - hw, y); else path.moveTo(cx - hw, y);
    }
    for (let i = steps; i >= 0; i--) {
      const ly = L.lerp(surfLy, baseLy, i / steps);
      path.lineTo(cx + innerHalf(ly), baseY + u * ly);
    }
    path.closePath();
    const surfY = baseY + u * surfLy, botY = baseY + u * baseLy;
    const midHalf = innerHalf((surfLy + baseLy) / 2);
    ctx.save();
    ctx.clip(path);
    ctx.fillStyle = L.rgba(P.schemBeer, 0.25);
    ctx.fillRect(cx - midHalf - 6, surfY - 2, 2 * midHalf + 12, botY - surfY + 6);
    for (let i = 0; i < 6; i++) {
      const rx = (L.h3(i, 1, seed) - 0.5) * 1.5 * midHalf;
      const ry = L.lerp(surfY + 10, botY - 8, L.h3(i, 2, seed));
      const rr = 2 + L.h3(i, 3, seed) * 3;
      ctx.fillStyle = L.rgba(P.gloss, 0.4);
      ctx.beginPath();
      ctx.arc(cx + rx, ry, rr, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = P.schemBeer;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - innerHalf(surfLy), surfY);
    ctx.lineTo(cx + innerHalf(surfLy), surfY);
    ctx.stroke();
    ctx.restore();
  }

  function checkMark(ctx, x, y, s, alpha) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha *= L.clamp(alpha);
    ctx.strokeStyle = P.schemTeal;
    ctx.lineWidth = 3.4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x - s * 0.5, y);
    ctx.lineTo(x - s * 0.08, y + s * 0.42);
    ctx.lineTo(x + s * 0.55, y - s * 0.46);
    ctx.stroke();
    ctx.restore();
  }

  // three labels, in the order the storyboard lists them; k is the 8th index from T 8.75
  const LABELS = [
    { k: 0, text: 'payload: 1 л', tx: 792, ty: 758, lx: 210, ly: 758, align: 'left' },
    { k: 1, text: 'header: пена', tx: 878, ty: 302, lx: 220, ly: 246, align: 'left' },
    { k: 2, text: 'id: FESB-9', tx: 1014, ty: 640, lx: 1340, ly: 600, align: 'left' },
  ];
  const LBL_START = 0.25, LBL_STEP = 0.25, LBL_DUR = 0.22;

  // the queue: three message boxes; box 0 is lit at t = 0, the highlight slides to box 1 at T 9.5
  const QBOX = [
    { x: 1560, y: 820 },
    { x: 1650, y: 820 },
    { x: 1740, y: 820 },
  ];
  const SLIDE_AT = 1.0, SLIDE_DUR = 5 * FR;

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);

      // 1: blueprint plate, guide centre near the mug
      L.blueprint(ctx, { center: [960, 480] });

      // 2: the hero mug at G1, blueprint line art, fully present (match cut)
      FILM.props.mug(ctx, 960, 900, 520, {
        fill: 0.88, foam: 1, logo: true, blueprint: true, line: 'hero', seed: sd('mug'),
      });
      beerGlow(ctx, 960, 900, 520, 0.88, sd('beerglow'));

      // 3: heading + small FESB line logo
      L.text(ctx, 'Сообщение создано', 180, 190, { size: 56, weight: 800, color: P.lineWhite });
      FILM.props.fesbLogo(ctx, 1700, 170, 90, { lineArt: true });

      // 4: labels with leader lines, one per 8th from T 8.75
      for (const lb of LABELS) {
        const p = L.clamp((t - (LBL_START + lb.k * LBL_STEP)) / LBL_DUR);
        if (p <= 0) continue;
        leader(ctx, lb.tx, lb.ty, lb.lx, lb.ly, p);
        const ty = lb.align === 'left' ? lb.ly + 8 : lb.ly + 8;
        L.text(ctx, lb.text, lb.lx + (lb.align === 'left' ? 10 : -10), ty, {
          size: 36, weight: 700, color: P.lineWhite, align: lb.align, alpha: L.clamp((p - 0.35) / 0.65),
        });
      }

      // 5: the queue of three message boxes, the mug icon inside each
      const slideP = L.clamp((t - SLIDE_AT) / SLIDE_DUR);
      const glowX = L.lerp(QBOX[0].x, QBOX[1].x, L.ease.outCubic(slideP));
      for (let i = 0; i < QBOX.length; i++) {
        const b = QBOX[i];
        msgBox(ctx, b.x, b.y, 76, 106, { gap: 7 });
        FILM.props.mug(ctx, b.x, b.y + 42, 46, {
          blueprint: true, fill: 0.72, foam: 1, line: 'secondary', seed: sd('boxmug', i),
        });
      }
      // the lit halo, sliding from box 0 to box 1 at T 9.5
      ctx.save();
      const gg = ctx.createRadialGradient(glowX, QBOX[0].y, 4, glowX, QBOX[0].y, 74);
      gg.addColorStop(0, L.rgba(P.schemBeer, 0.5));
      gg.addColorStop(1, L.rgba(P.schemBeer, 0));
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.arc(glowX, QBOX[0].y, 74, 0, TAU);
      ctx.fill();
      ctx.restore();
      // the teal tick on the now-delivered box 0
      const checkA = L.clamp((slideP - 0.25) / 0.75);
      checkMark(ctx, QBOX[0].x + 22, QBOX[0].y - 36, 26, checkA);
    },
  });
})();

</script>
<script>
// ---- src/scenes/06-waitress.js
/*
 * 06-waitress.js : "Ten mugs across the hall" — T 10.0 to 12.5 (t 0 to 2.5), illustrated, hard cut.
 *
 * Layers back to front:
 *   1. Spaten House hall background (FILM.props.hallBack, variant 'hall'), panned by camX.
 *   2. Bunting and bulb garlands swagged across the ceiling (background depth, same pan as the hall).
 *   3. Resi, Vroni and Gretl crossing right-to-left at the back (~0.6 Liesl height), same pan.
 *   4. Middle-depth long tables with teammates (upper body only) turning heads to track Liesl.
 *   5. Liesl (hero waitress), screen-fixed: walks feet x 300 -> 1480, reaching G2 at T 12.25 and
 *      holding to the end (the exact match-cut frame that 07's blueprint continues from).
 *   6. Foreground table edge + pretzel, bottom-left, screen-fixed (closest plane).
 *
 * G2 (docs/storyboard.md): feet (1480, 1000), height 820, facing right, mug fans (1300,600) and
 * (1660,600). FILM.cast.waitress's FAN constants (180/820, 400/820) reproduce those fan centres
 * exactly for x=1480,y=1000,h=820, so no extra bookkeeping is needed for the hand-off to 07.
 */
(function () {
  'use strict';
  const ID = 'waitress';
  const FILM = window.FILM;
  const LIB = FILM.lib;
  const PR = FILM.props;
  const CAST = FILM.cast;

  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;
  const TAU2 = Math.PI * 2;

  // Background pan: matches FILM.props.hallBack's own camX handling (cast-api.md "Additions"):
  // the wall shifts by clamp(camX * 0.6, -480, 480) px. We reuse that exact formula for every prop
  // we place on the same background plane (bunting, garlands, tables, the back-crossing waitresses)
  // so everything pans together; Liesl and the foreground table stay screen-fixed.
  const BG_PAR = 0.6, BG_SHIFT_MAX = 480, CAMX_MAX = 620;

  let GEO = null;
  function geo(L) {
    if (GEO) return GEO;
    // ceiling swag segments (world x), several short spans read as real festoons rather than one dip
    const segs = [];
    for (let x = -300; x < 2450; x += 430) segs.push([x, Math.min(x + 430, 2450)]);
    // four long tables (world x centre), two teammates each, seen from the front across the table
    const tableX = [560, 1080, 1600, 2120];
    const tables = tableX.map((wx, i) => ({
      wx,
      y: 760,
      w: 470,
      // 6 upper-body teammates total (2 at the first and third tables, 1 at the others) keeps the
      // crowd lively without drawing more full figures than the composition needs
      mates: (i % 2 === 0 ? [0, 1] : [0]).map((slot) => ({
        dx: slot === 0 ? -100 : 100,
        spec: CAST.TEAM[(sd('mate', i, slot) >>> 0) % CAST.TEAM.length],
        ph: ((sd('matePhase', i, slot) >>> 0) % 1000) / 1000,
      })),
      mugSeed: sd('tablemug', i),
    }));
    // Resi, Vroni and Gretl cross right to left at the back, staggered, above the tables' row
    const crossers = [
      { who: 'resi', carry: 'mugs', plate: null, x0: 1520, x1: -200, y: 680, ph: 0.1 },
      { who: 'vroni', carry: 'plate', plate: 'sausages', x0: 1740, x1: 30, y: 680, ph: 0.42 },
      { who: 'gretl', carry: 'plate', plate: 'pretzels', x0: 1960, x1: 260, y: 680, ph: 0.71 },
    ];
    // foam flecks kicked up on Liesl's footfall beats (T 10.0 .. 12.0, every 0.5 s)
    const flecks = [];
    for (let i = 0; i < 5; i++) {
      const t0 = i * 0.5;
      const pts = [];
      for (let k = 0; k < 6; k++) {
        const a = -Math.PI * 0.5 + (LIB.h3(i, k, 1) - 0.5) * 2.1;
        const v = 60 + LIB.h3(i, k, 2) * 90;
        pts.push({ a, v, r: 2 + LIB.h3(i, k, 3) * 2.6 });
      }
      flecks.push({ t0, pts });
    }
    GEO = { segs, tables, crossers, flecks };
    return GEO;
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      const t = L.clamp(tIn, 0, info.dur);
      const clamp = L.clamp, lerp = L.lerp;
      const G = geo(L);
      const T = info.T;
      const tw = L.onTwos(t); // characters move on twos; the camera pan itself stays at 24 fps

      // ---- camera pan (background plane only; Liesl and the foreground stay screen-fixed) ----
      const camX = CAMX_MAX * E.outCubic(clamp(t / info.dur));
      const shift = clamp(camX * BG_PAR, -BG_SHIFT_MAX, BG_SHIFT_MAX);
      const bgX = (worldX) => worldX - shift;

      // ---- Liesl: screen-fixed walk, feet x 300 -> 1480, arriving on the 8th at T 12.25 ----
      const ARRIVE = 2.25; // T 12.25
      const feetX0 = 300, feetX1 = 1480;
      const walkP = E.outCubic(clamp(tw / ARRIVE));
      const lieslX = lerp(feetX0, feetX1, walkP);
      const walkClock = Math.min(tw, 2.0); // last footstep beat T 12.0; the last 0.25 s glides to a settled stance

      // =========================================================================
      // 1. hall background
      // =========================================================================
      PR.hallBack(ctx, { variant: 'hall', camX, dim: 0, t: T });

      // =========================================================================
      // 2. bunting and garlands across the ceiling — a static wide strip, cached once and panned
      // =========================================================================
      const DECO_X0 = -320, DECO_X1 = 2470, DECO_W = DECO_X1 - DECO_X0, DECO_H = 340;
      const deco = LIB.cached(['waitress-deco', info.S].join('|'), () => {
        const c = FILM.makeCanvas(Math.max(1, Math.round(DECO_W * info.S)), Math.max(1, Math.round(DECO_H * info.S)));
        const g = c.getContext('2d');
        g.scale(info.S, info.S);
        g.translate(-DECO_X0, 0);
        for (let i = 0; i < G.segs.length; i++) {
          const [x0, x1] = G.segs[i];
          PR.bunting(g, x0, 176, x1, 176, 42, { t: 0, boil: 0, seed: sd('bunt', i), line: 'background' });
        }
        for (let i = 0; i < G.segs.length; i++) {
          const [x0, x1] = G.segs[i];
          PR.garland(g, x0, 236, x1, 236, 60, { t: 0, boil: 0, seed: sd('garl', i), glow: 1 });
        }
        return c;
      });
      ctx.drawImage(deco, 0, 0, deco.width, deco.height, DECO_X0 - shift, 0, DECO_W, DECO_H);

      // =========================================================================
      // 3. Resi, Vroni and Gretl crossing at the back (~0.6 Liesl height)
      // =========================================================================
      const CROSS_H = 492; // 0.6 * 820
      for (const c of G.crossers) {
        const wx = lerp(c.x0, c.x1, clamp(tw / info.dur));
        const sx = bgX(wx);
        CAST.waitress(ctx, sx, c.y, CROSS_H, { name: 'walk', t: tw + c.ph }, {
          who: c.who, facing: -1, carry: c.carry, plate: c.plate || undefined, line: 'secondary',
        });
      }

      // =========================================================================
      // 4. middle-depth tables — a static wide strip, cached once and panned
      // =========================================================================
      const TAB_X0 = 300, TAB_X1 = 2380, TAB_W = TAB_X1 - TAB_X0, TAB_Y0 = 560, TAB_Y1 = 960, TAB_H = TAB_Y1 - TAB_Y0;
      const tablesImg = LIB.cached(['waitress-tables', info.S].join('|'), () => {
        const c = FILM.makeCanvas(Math.max(1, Math.round(TAB_W * info.S)), Math.max(1, Math.round(TAB_H * info.S)));
        const g = c.getContext('2d');
        g.scale(info.S, info.S);
        g.translate(-TAB_X0, -TAB_Y0);
        for (const tb of G.tables) {
          const table = PR.table(g, tb.wx, tb.y, tb.w, { bench: 'back', line: 'secondary', seed: tb.mugSeed, boil: 0 });
          PR.mug(g, tb.wx + tb.w * 0.2, table.top, 92, { fill: 0.85, foam: 1.05, bubbles: true, t: 0, boil: 0, line: 'background', seed: tb.mugSeed });
        }
        return c;
      });
      ctx.drawImage(tablesImg, 0, 0, tablesImg.width, tablesImg.height, TAB_X0 - shift, TAB_Y0, TAB_W, TAB_H);

      // teammates ride the same pan as their table but are drawn fresh; look tracks Liesl, quantized
      // to the 0.1 steps the engine already caches heads at (art bible 7: characters move on twos)
      const MATE_H = 600;
      for (const tb of G.tables) {
        const sx = bgX(tb.wx);
        for (const m of tb.mates) {
          const mx = sx + m.dx;
          const look = Math.round(clamp((lieslX - mx) / 260, -1, 1) * 10) / 10;
          CAST.person(ctx, m.spec, mx, 1000, MATE_H, { name: 'stand', look }, { upper: true, outfit: 'casual', line: 'secondary' });
        }
      }

      // =========================================================================
      // 5. Liesl, screen-fixed hero, ten mugs, hero mug at the front of the right fan
      // =========================================================================
      CAST.waitress(ctx, lieslX, 1000, 820, { name: 'walk', t: walkClock }, {
        who: 'liesl', heroMug: true, facing: 1, line: 'hero',
      });

      // foam flecks kicked up on each footfall beat, at her current screen position
      for (const f of G.flecks) {
        const dt = t - f.t0;
        if (dt < 0 || dt > 0.4) continue;
        const life = clamp(dt / 0.4);
        const fx = lerp(feetX0, feetX1, E.outCubic(clamp(f.t0 / ARRIVE))) + 26;
        const fy = 1006;
        ctx.save();
        ctx.globalAlpha = 1 - life;
        ctx.fillStyle = P.foam;
        for (const pt of f.pts) {
          const px = fx + Math.cos(pt.a) * pt.v * dt;
          const py = fy + Math.sin(pt.a) * pt.v * dt + 260 * dt * dt;
          ctx.beginPath();
          ctx.arc(px, py, Math.max(0.4, pt.r * (1 - life * 0.6)), 0, TAU2);
          ctx.fill();
        }
        ctx.restore();
      }

      // =========================================================================
      // 6. foreground table edge + pretzel, bottom-left, screen-fixed and identical every frame
      // =========================================================================
      const FG_W = 640, FG_H = 340;
      const fgImg = LIB.cached(['waitress-fg', info.S].join('|'), () => {
        const c = FILM.makeCanvas(Math.max(1, Math.round(FG_W * info.S)), Math.max(1, Math.round(FG_H * info.S)));
        const g = c.getContext('2d');
        g.scale(info.S, info.S);
        g.translate(0, -(1080 - FG_H));
        const fg = PR.table(g, -160, 1015, 900, { bench: 'none', line: 'hero', depth: 46, seed: sd('fgtable'), boil: 0 });
        PR.pretzel(g, 130, fg.top - 4, 220, { rot: -0.08, line: 'hero', seed: sd('fgpretzel'), boil: 0 });
        return c;
      });
      ctx.drawImage(fgImg, 0, 0, fgImg.width, fgImg.height, 0, 1080 - FG_H, FG_W, FG_H);
    },
  });
})();

</script>
<script>
// ---- src/scenes/07-bp-route.js
// Shot 07 'bp-route' — schematic (blueprint), T 12.5-14.0 (global), shot-local t 0..1.5.
// Match cut: the waitress's silhouette and the route hold the screen position she reaches at the end
// of 06 (G2: feet (1480, 1000), height 820, mug fans at (1300, 600) and (1660, 600)); everything here
// is present and static on frame 0.
//
// Layers back to front:
//   1. lib.blueprint plate
//   2. the route: tap node "Кран" (x 200) -> her feet -> table node "Стол FESB" (1760, 900), schemBeer,
//      turning schemTeal once delivery completes; a small travelling dot while it is in flight
//   3. the waitress at G2 as a double-outline silhouette, her ten mugs as ten message boxes in the fans
//   4. heading "Маршрутизация" + the small FESB line logo (top-right)
//   5. the ten boxes ticking schemTeal one by one from T 12.75, the "Доставка: k/10" counter following,
//      "10/10 ✓" popping at T 13.75
(function () {
  'use strict';

  const FILM = window.FILM;
  const L = FILM.lib;
  const P = L.pal;
  const TAU = Math.PI * 2;
  const ID = 'bp-route';

  const sd = (...k) => L.hash(ID, ...k) & 0x7fffffff;

  // --- G2 geometry (docs/storyboard.md) ---
  const FEET = [1480, 1000];
  const FIG_H = 820;
  const FANL = [1300, 600], FANR = [1660, 600];
  const TAP = [200, 1000], TABLE = [1760, 900];

  // waitress silhouette (dirndl): head + braided crown on a neck, puffed sleeves, laced bodice, a
  // flared skirt (waist -> hip -> hem) with an apron and bow, shoes; arms reach straight out to the
  // two mug fans (art bible 10.2). The neck keeps the head visually joined to the shoulders.
  const CX = 1480;
  const HEAD_R = 50, HEAD_CY = 234;
  const NECK_TOP = 284, SHOULDER_Y = 312, WAIST_Y = 500, HIP_Y = 680, HEM_Y = 900, FOOT_Y = 1000;
  const NECK = [[CX - 17, NECK_TOP], [CX - 24, SHOULDER_Y], [CX + 24, SHOULDER_Y], [CX + 17, NECK_TOP]];
  const BODICE = [[CX - 74, SHOULDER_Y], [CX - 58, WAIST_Y], [CX + 58, WAIST_Y], [CX + 74, SHOULDER_Y]];
  const SKIRT = [
    [CX - 58, WAIST_Y], [CX - 84, HIP_Y], [CX - 195, HEM_Y],
    [CX + 195, HEM_Y], [CX + 84, HIP_Y], [CX + 58, WAIST_Y],
  ];
  const APRON = [[CX - 44, WAIST_Y + 4], [CX - 74, 730], [CX + 74, 730], [CX + 44, WAIST_Y + 4]];
  const SLEEVE_L = [CX - 74, SHOULDER_Y + 8], SLEEVE_R = [CX + 74, SHOULDER_Y + 8];
  const SLEEVE_RAD = 24;
  // her hands reach straight out to the two mug fans
  const HAND_L = FANL, HAND_R = FANR;
  const SHOE_L = [CX - 32, FOOT_Y], SHOE_R = [CX + 30, FOOT_Y];
  const BOW_AT = [CX + 58, WAIST_Y + 6]; // her left, the viewer's right (art bible 10.2)

  /** A braided band across the top of the head, with short cross-ticks suggesting the braid. */
  function braidCrown(ctx, cx, cy, r) {
    const rad = (d) => (d * Math.PI) / 180;
    const rB = r + 9;
    ctx.save();
    ctx.strokeStyle = L.rgba(P.paleBlue, 0.7);
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(cx, cy, rB, rad(198), rad(342));
    ctx.stroke();
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let i = 0; i <= 7; i++) {
      const a = rad(198 + (144 * i) / 7);
      const x0 = cx + Math.cos(a) * (rB - 6), y0 = cy + Math.sin(a) * (rB - 6);
      const x1 = cx + Math.cos(a) * (rB + 6), y1 = cy + Math.sin(a) * (rB + 6);
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
    }
    ctx.stroke();
    ctx.restore();
  }

  /** A small schematic bow-knot glyph. */
  function drawBow(ctx, x, y, s) {
    ctx.save();
    ctx.strokeStyle = L.rgba(P.lineWhite, 0.9);
    ctx.lineWidth = 2.4;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - s, y - s * 0.62);
    ctx.lineTo(x - s * 0.22, y);
    ctx.lineTo(x - s, y + s * 0.62);
    ctx.closePath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + s, y - s * 0.62);
    ctx.lineTo(x + s * 0.22, y);
    ctx.lineTo(x + s, y + s * 0.62);
    ctx.closePath();
    ctx.stroke();
    ctx.strokeRect(x - s * 0.16, y - s * 0.24, s * 0.32, s * 0.48);
    ctx.restore();
  }

  /** A small shoe glyph, toe pointing away from cx. */
  function drawShoe(ctx, x, y, flip) {
    const s = flip ? -1 : 1;
    ctx.save();
    ctx.strokeStyle = L.rgba(P.paleBlue, 0.7);
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 16 * s, y - 14);
    ctx.lineTo(x - 16 * s, y + 6);
    ctx.quadraticCurveTo(x - 16 * s, y + 16, x + 4 * s, y + 16);
    ctx.lineTo(x + 24 * s, y + 16);
    ctx.quadraticCurveTo(x + 30 * s, y + 16, x + 24 * s, y + 8);
    ctx.lineTo(x + 6 * s, y);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  /**
   * A closed polygon as a primary double outline (art bible section 5): lineWhite outer, paleBlue
   * inner, the inner line inset `gap` px inward along each edge's own normal (not a uniform centroid
   * scale, which distorts an elongated or waisted silhouette).
   */
  function primaryPoly(ctx, pts, gap) {
    gap = gap == null ? 10 : gap;
    const n = pts.length;
    let cx = 0, cy = 0;
    for (const [x, y] of pts) { cx += x; cy += y; }
    cx /= n; cy /= n;
    const inward = (ax, ay, bx, by, nx, ny) => {
      const midx = (ax + bx) / 2, midy = (ay + by) / 2;
      return (cx - midx) * nx + (cy - midy) * ny < 0 ? [-nx, -ny] : [nx, ny];
    };
    const inner = pts.map((p, i) => {
      const prev = pts[(i - 1 + n) % n], next = pts[(i + 1) % n];
      const e1x = p[0] - prev[0], e1y = p[1] - prev[1];
      const e2x = next[0] - p[0], e2y = next[1] - p[1];
      const l1 = Math.hypot(e1x, e1y) || 1, l2 = Math.hypot(e2x, e2y) || 1;
      let [n1x, n1y] = inward(prev[0], prev[1], p[0], p[1], -e1y / l1, e1x / l1);
      let [n2x, n2y] = inward(p[0], p[1], next[0], next[1], -e2y / l2, e2x / l2);
      let nx = n1x + n2x, ny = n1y + n2y;
      const nl = Math.hypot(nx, ny) || 1;
      nx /= nl; ny /= nl;
      const cosA = n1x * n2x + n1y * n2y;
      const miter = Math.min(2.2, 1 / Math.max(0.45, Math.sqrt((1 + cosA) / 2)));
      return [p[0] + nx * gap * miter, p[1] + ny * gap * miter];
    });
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.strokeStyle = L.rgba(P.lineWhite, 0.85);
    ctx.lineWidth = 3;
    ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.closePath();
    ctx.stroke();
    ctx.strokeStyle = L.rgba(P.paleBlue, 0.5);
    ctx.lineWidth = 2;
    ctx.beginPath();
    inner.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  /** A circle as a primary double outline. */
  function primaryCircle(ctx, cx, cy, r, gap) {
    gap = gap == null ? 10 : gap;
    ctx.save();
    ctx.strokeStyle = L.rgba(P.lineWhite, 0.85);
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = L.rgba(P.paleBlue, 0.5);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(2, r - gap), 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  /** A secondary single stroke (paleBlue 60%, 2 px), the weight for limbs, icons and leader-weight lines. */
  function secLine(ctx, pts, o) {
    o = o || {};
    ctx.save();
    ctx.strokeStyle = L.rgba(o.color || P.paleBlue, o.alpha != null ? o.alpha : 0.6);
    ctx.lineWidth = o.width || 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    if (o.closed) ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  /** A schematic "message" rectangle centred at (x, y): primary double outline (as in 05). */
  function msgBox(ctx, x, y, w, h, o) {
    o = o || {};
    const gap = o.gap != null ? o.gap : 6;
    const x0 = x - w / 2, y0 = y - h / 2;
    ctx.save();
    const glow = o.glow || 0;
    if (glow > 0) {
      ctx.save();
      ctx.globalAlpha = 0.9 * glow;
      ctx.shadowColor = P.schemTeal;
      ctx.shadowBlur = 14 * glow;
      ctx.strokeStyle = P.schemTeal;
      ctx.lineWidth = 2.4;
      ctx.strokeRect(x0, y0, w, h);
      ctx.restore();
    }
    ctx.strokeStyle = L.rgba(o.outline || P.lineWhite, 0.85);
    ctx.lineWidth = 2.4;
    ctx.strokeRect(x0, y0, w, h);
    ctx.strokeStyle = L.rgba(P.paleBlue, 0.5);
    ctx.lineWidth = 1.6;
    ctx.strokeRect(x0 + gap, y0 + gap, w - 2 * gap, h - 2 * gap);
    ctx.restore();
  }

  function checkMark(ctx, x, y, s, alpha) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha *= L.clamp(alpha);
    ctx.strokeStyle = P.schemTeal;
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x - s * 0.5, y);
    ctx.lineTo(x - s * 0.08, y + s * 0.42);
    ctx.lineTo(x + s * 0.55, y - s * 0.46);
    ctx.stroke();
    ctx.restore();
  }

  // ten mug boxes, five per fan, delivered left to right through fanL then fanR
  function fanBoxes(center) {
    const offs = [-120, -60, 0, 60, 120];
    return offs.map((off) => [center[0] + off, center[1] - 26 * (1 - (off / 120) * (off / 120))]);
  }
  const BOXES = fanBoxes(FANL).concat(fanBoxes(FANR));

  const TICK_START = 0.25, TICK_STEP = 0.1; // T 12.75, one every 0.1 s
  const DONE_AT = 1.25; // T 13.75

  function pointOnRoute(f) {
    const L1 = Math.hypot(FEET[0] - TAP[0], FEET[1] - TAP[1]);
    const L2 = Math.hypot(TABLE[0] - FEET[0], TABLE[1] - FEET[1]);
    const d = L.clamp(f) * (L1 + L2);
    if (d <= L1) {
      const u = d / L1;
      return [L.lerp(TAP[0], FEET[0], u), L.lerp(TAP[1], FEET[1], u)];
    }
    const u = (d - L1) / L2;
    return [L.lerp(FEET[0], TABLE[0], u), L.lerp(FEET[1], TABLE[1], u)];
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);

      // 1: blueprint plate, guide centre near her
      L.blueprint(ctx, { center: [1300, 560] });

      const doneP = L.clamp((t - DONE_AT) / (4 / 24));
      const routeColor = L.mix(P.schemBeer, P.schemTeal, doneP);

      // 2: the route — tap -> her feet -> table, with an arrowhead, and a small dot in flight
      secLine(ctx, [TAP, FEET, TABLE], { color: routeColor, alpha: 0.85, width: 3 });
      {
        const [ax, ay] = TABLE;
        const ang = Math.atan2(TABLE[1] - FEET[1], TABLE[0] - FEET[0]);
        const s = 16;
        ctx.save();
        ctx.fillStyle = L.rgba(routeColor, 0.85);
        ctx.translate(ax, ay);
        ctx.rotate(ang);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-s, -s * 0.55);
        ctx.lineTo(-s, s * 0.55);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      // tap node
      primaryCircle(ctx, TAP[0], TAP[1], 26, 8);
      secLine(ctx, [[TAP[0], TAP[1] - 26], [TAP[0], TAP[1] - 50]], { color: P.paleBlue, alpha: 0.6 });
      L.text(ctx, 'Кран', 224, 950, { size: 34, weight: 700, color: P.lineWhite, align: 'center' });
      // table node
      msgBox(ctx, TABLE[0] - 30, TABLE[1], 90, 46, { gap: 5 });
      L.text(ctx, 'Стол FESB', 1750, 848, { size: 34, weight: 700, color: P.lineWhite, align: 'right' });
      // travelling dot while the route is in flight
      if (t >= TICK_START && t < DONE_AT) {
        const f = L.clamp((t - TICK_START) / (DONE_AT - TICK_START));
        const [dx, dy] = pointOnRoute(f);
        ctx.save();
        ctx.fillStyle = P.schemBeer;
        ctx.beginPath();
        ctx.arc(dx, dy, 7, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = L.rgba(P.gloss, 0.7);
        ctx.lineWidth = 1.4;
        ctx.stroke();
        ctx.restore();
      }

      // 3: the waitress — a recognisable dirndl silhouette at G2 — + her ten mugs as message boxes
      primaryPoly(ctx, SKIRT, 10);
      // the apron: a filled panel so it reads as a distinct layer, not just another outline
      ctx.save();
      ctx.fillStyle = L.rgba(P.lineWhite, 0.1);
      ctx.beginPath();
      APRON.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      secLine(ctx, APRON, { closed: true, width: 2.2, color: P.lineWhite, alpha: 0.8 });
      drawBow(ctx, BOW_AT[0], BOW_AT[1] + 26, 26);
      primaryPoly(ctx, BODICE, 8);
      secLine(ctx, [[CX - 2, SHOULDER_Y + 20], [CX - 2, WAIST_Y - 10]], { width: 1.6 });
      for (let i = 0; i < 4; i++) {
        const y = L.lerp(SHOULDER_Y + 28, WAIST_Y - 14, i / 3);
        secLine(ctx, [[CX - 18, y - 6], [CX - 2, y]], { width: 1.6 });
        secLine(ctx, [[CX + 18, y + 6], [CX + 2, y]], { width: 1.6 });
      }
      secLine(ctx, [SLEEVE_L, HAND_L], { width: 5 });
      secLine(ctx, [SLEEVE_R, HAND_R], { width: 5 });
      primaryCircle(ctx, SLEEVE_L[0], SLEEVE_L[1], SLEEVE_RAD, 6);
      primaryCircle(ctx, SLEEVE_R[0], SLEEVE_R[1], SLEEVE_RAD, 6);
      primaryPoly(ctx, NECK, 5);
      primaryCircle(ctx, CX, HEAD_CY, HEAD_R, 9);
      braidCrown(ctx, CX, HEAD_CY, HEAD_R);
      drawShoe(ctx, SHOE_L[0], SHOE_L[1], true);
      drawShoe(ctx, SHOE_R[0], SHOE_R[1], false);

      for (let i = 0; i < BOXES.length; i++) {
        const [bx, by] = BOXES[i];
        const tickT = TICK_START + i * TICK_STEP;
        const delivered = t >= tickT;
        const popA = L.clamp((t - tickT) / (3 / 24));
        msgBox(ctx, bx, by, 54, 76, { glow: delivered ? popA : 0, outline: delivered ? P.schemTeal : P.lineWhite, gap: 5 });
        FILM.props.mug(ctx, bx, by + 30, 34, {
          blueprint: true, fill: 0.72, foam: 1, line: 'secondary', seed: sd('fanmug', i),
        });
        checkMark(ctx, bx + 16, by - 26, 18, delivered ? popA : 0);
      }

      // 4: heading + small FESB line logo
      L.text(ctx, 'Маршрутизация', 180, 190, { size: 56, weight: 800, color: P.lineWhite });
      FILM.props.fesbLogo(ctx, 1700, 170, 90, { lineArt: true });

      // 5: delivery counter, "10/10 ✓" popping at T 13.75
      const count = t >= TICK_START ? Math.min(10, Math.floor((t - TICK_START) / TICK_STEP + 1e-9) + 1) : 0;
      if (t < DONE_AT) {
        L.text(ctx, `Доставка: ${count}/10`, 180, 300, { size: 44, weight: 700, color: P.lineWhite });
      } else {
        const pop = L.clamp((t - DONE_AT) / (4 / 24));
        const sc = pop < 1 ? 1.1 * L.ease.outCubic(pop) : 1;
        ctx.save();
        ctx.translate(180, 300);
        ctx.scale(sc, sc);
        L.text(ctx, 'Доставка: 10/10 ✓', 0, 0, { size: 44, weight: 700, color: P.schemTeal });
        ctx.restore();
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/08-prost.js
/*
 * 08-prost.js : "Pork knuckle and Prost!" — T 14.0 to 16.0 (t 0 to 2.0), illustrated, hard cuts on
 * both sides (no shared geometry to match).
 *
 * Layers back to front, all inside a 5% kick-zoom on the clink (the caption is screen-fixed):
 *   1. Warm close-table backdrop (a glimpse of bunting at the very top) and two static side dishes.
 *   2. The pork knuckle: mid-air at t 0, lands at (960,700) on T 14.25 with a squash and a gravy
 *      splash, carried by Resi's serveArm entering top-left, which withdraws (fades) after landing.
 *   3. The hero mug slides in and lands at x 1320 on T 14.5, sloshing as it settles.
 *   4. Six teammates (FILM.cast.person, upper body, pose 'reach') swing their mugs up from the
 *      table's near edge toward the centre above the knuckle, T 14.5 -> 15.0.
 *   5. The clink on T 15.0: a sparkle flash, a starburst of foam droplets and rising gold bubbles.
 * Caption "Prost!" (FILM.props.caption) pops on T 15.0, screen-fixed outside the kick-zoom so its
 * ink never drifts toward the safe-area edge.
 */
(function () {
  'use strict';
  const ID = 'prost';
  const FILM = window.FILM;
  const LIB = FILM.lib;
  const PR = FILM.props;
  const CAST = FILM.cast;
  const TAU2 = Math.PI * 2;
  const FRAME = 1 / 24;

  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;

  const T_KNUCKLE = 0.25; // T 14.25
  const T_MUG = 0.5; // T 14.5
  const T_CLINK = 1.0; // T 15.0
  const CLINK_X = 960, CLINK_Y = 470; // above the knuckle, where the six mugs meet

  let GEO = null;
  function geo() {
    if (GEO) return GEO;
    const REACH_X = [170, 490, 780, 1130, 1420, 1750];
    const rSeed = sd('reach');
    const reachers = REACH_X.map((x, i) => ({
      x,
      spec: CAST.TEAM[(i * 2 + 1) % CAST.TEAM.length],
      flip: i % 2 === 1,
      tilt: (LIB.h3(rSeed, i, 5) - 0.5) * 0.5,
      ph: LIB.h3(rSeed, i, 6) * 0.6,
    }));
    const gravySeed = sd('gravy');
    const gravy = [];
    for (let i = 0; i < 14; i++) {
      const a = -Math.PI * 0.62 + LIB.h3(gravySeed, i, 1) * Math.PI * 1.24;
      const v = 90 + LIB.h3(gravySeed, i, 2) * 220;
      gravy.push({ a, v, r: 3 + LIB.h3(gravySeed, i, 3) * 5, kraut: LIB.h3(gravySeed, i, 4) > 0.72 });
    }
    const burstSeed = sd('burst');
    const burst = [];
    for (let i = 0; i < 20; i++) {
      const a = (i / 20) * TAU2 + (LIB.h3(burstSeed, i, 1) - 0.5) * 0.5;
      const v = 160 + LIB.h3(burstSeed, i, 2) * 260;
      burst.push({ a, v, r: 3 + LIB.h3(burstSeed, i, 3) * 6, gold: LIB.h3(burstSeed, i, 4) > 0.45 });
    }
    GEO = { reachers, gravy, burst };
    return GEO;
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, E = L.ease;
      const t = L.clamp(tIn, 0, info.dur);
      const clamp = L.clamp, lerp = L.lerp;
      const T = info.T;
      const G = geo();

      // decay(land, frames): 1 right at `land`, linearly down to 0 over `frames` frames — the shared
      // shape for a landing squash / a jump bump.
      const decay = (land, frames) => (t < land ? 0 : clamp(1 - (t - land) / (frames * FRAME)));
      const knuckleSquash = decay(T_KNUCKLE, 2);
      const jump = t < T_KNUCKLE ? 0 : Math.max(0, Math.sin(Math.PI * clamp((t - T_KNUCKLE) / (6 * FRAME))));

      // knuckle: mid-air at t 0, gravity-eases down, lands and stays at (960, 700)
      const knuckleY = t < T_KNUCKLE ? lerp(480, 700, E.inQuad(clamp(t / T_KNUCKLE))) : 700;
      const knuckleH = 440;

      // hero mug: slides in from the right, lands at (1320, 760) on T 14.5
      const mugP = E.outCubic(clamp((t - 0.3) / (T_MUG - 0.3)));
      const mugX = t < 0.3 ? 2050 : lerp(2050, 1320, mugP);
      const mugY = t < 0.3 ? 660 : lerp(660, 760, mugP);
      const mugSquash = decay(T_MUG, 2);
      const sloshEnv = t < T_MUG ? 0 : Math.exp(-7 * (t - T_MUG));
      const slosh = clamp(sloshEnv * Math.sin((t - T_MUG) * 42) * 0.85, -1, 1);

      // kick-zoom: 5% right on the clink beat, settling over 6 frames
      const zoomK = t < T_CLINK ? 0 : clamp(1 - (t - T_CLINK) / (6 * FRAME));
      const zoom = 1 + 0.05 * zoomK;

      L.camera(ctx, { x: 960, y: 540, zoom }, () => {
        // =====================================================================
        // 1. backdrop: warm close-table gradient, a glimpse of bunting, side dishes
        // =====================================================================
        const bg = ctx.createLinearGradient(0, 0, 0, 1080);
        bg.addColorStop(0, L.mix(P.hallDim, P.woodDeep, 0.35));
        bg.addColorStop(0.16, L.mix(P.woodMid, P.hallWarm, 0.25));
        bg.addColorStop(1, P.woodLight);
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, 1920, 1080);
        // faint wood grain streaks
        ctx.save();
        ctx.globalAlpha = 0.16;
        ctx.strokeStyle = P.woodDeep;
        ctx.lineWidth = 3;
        const r = L.rng(sd('grain'));
        for (let i = 0; i < 10; i++) {
          const gy = 140 + i * 92 + r.range(-14, 14);
          ctx.beginPath();
          ctx.moveTo(-40, gy);
          ctx.bezierCurveTo(500, gy + r.range(-18, 18), 1400, gy + r.range(-18, 18), 1960, gy);
          ctx.stroke();
        }
        ctx.restore();
        PR.bunting(ctx, -80, 46, 2000, 46, 30, { t: T, seed: sd('bunt'), line: 'background' });

        ctx.save();
        ctx.translate(0, -10 * jump);
        PR.pretzel(ctx, 1660, 300, 210, { rot: 0.18, line: 'secondary', seed: sd('pretz') });
        ctx.restore();
        ctx.save();
        ctx.translate(0, -8 * jump);
        PR.sausages(ctx, 300, 940, 190, { rot: -0.08, line: 'secondary', seed: sd('saus') });
        ctx.restore();

        // =====================================================================
        // 2. the knuckle, carried in and set down by Resi's arm
        // =====================================================================
        const armFadeStart = 0.3, armFadeEnd = 0.56;
        const armAlpha = t < armFadeStart ? 1 : clamp(1 - (t - armFadeStart) / (armFadeEnd - armFadeStart));
        if (armAlpha > 0.01) {
          CAST.serveArm(ctx, 960, knuckleY, 2.9, { plate: 'knuckle', from: -2.4, alpha: armAlpha, line: 'secondary' });
        }
        PR.knuckle(ctx, 960, knuckleY, knuckleH, { squash: knuckleSquash, line: 'hero', seed: sd('knuckle') });

        // gravy splash at the landing instant
        if (t >= T_KNUCKLE) {
          const dt = t - T_KNUCKLE, life = 0.5;
          if (dt < life) {
            const fade = 1 - dt / life;
            ctx.save();
            ctx.globalAlpha = fade;
            for (const g of G.gravy) {
              const px = 960 + Math.cos(g.a) * g.v * dt;
              const py = 700 - 30 + Math.sin(g.a) * g.v * dt * 0.6 + 520 * dt * dt;
              ctx.fillStyle = g.kraut ? P.kraut : P.crust;
              ctx.beginPath();
              ctx.arc(px, py, Math.max(0.5, g.r * (1 - dt / life)), 0, TAU2);
              ctx.fill();
            }
            ctx.restore();
          }
        }

        // =====================================================================
        // 3. the hero mug, set down at the right
        // =====================================================================
        ctx.save();
        ctx.translate(mugX, mugY);
        ctx.scale(1 + 0.07 * mugSquash, 1 - 0.09 * mugSquash);
        ctx.translate(-mugX, -mugY);
        PR.mug(ctx, mugX, mugY, 460, {
          fill: 0.86, foam: 1.1, logo: true, bubbles: true, t: T, slosh, line: 'hero', seed: sd('heromug'),
        });
        ctx.restore();

        // =====================================================================
        // 4. six teammates swing their mugs up toward the centre
        // =====================================================================
        const reachK = clamp((t - T_MUG) / (T_CLINK - T_MUG));
        const swing = E.outBack(reachK);
        for (const rc of G.reachers) {
          const wobble = t >= T_CLINK ? 0.05 * Math.sin((t - T_CLINK) * 5 + rc.ph * 10) : 0;
          CAST.person(ctx, rc.spec, rc.x, 1000, 420, { name: 'reach', k: swing }, {
            upper: true, outfit: 'casual', flip: rc.flip, line: 'secondary',
            mug: { fill: 0.85, foam: 1.05, bubbles: true, t: T, tilt: rc.tilt + wobble },
          });
        }

        // =====================================================================
        // 5. the clink: sparkle flash, foam-and-gold starburst, rising bubbles
        // =====================================================================
        if (t >= T_CLINK) {
          const dt = t - T_CLINK;
          PR.sparkle(ctx, CLINK_X, CLINK_Y, 150, clamp(dt / 0.5 + 1 / 12)); // +lead: visible on the beat frame
          const life = 1.0;
          if (dt < life) {
            const fade = 1 - dt / life;
            ctx.save();
            ctx.globalAlpha = fade;
            for (const b of G.burst) {
              const px = CLINK_X + Math.cos(b.a) * b.v * dt;
              const py = CLINK_Y + Math.sin(b.a) * b.v * dt + 420 * dt * dt;
              if (b.gold) {
                ctx.fillStyle = P.gold;
                ctx.strokeStyle = P.goldDeep;
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.arc(px, py, Math.max(0.6, b.r * (1 - dt / life * 0.5)), 0, TAU2);
                ctx.fill();
                ctx.stroke();
              } else {
                ctx.fillStyle = P.foam;
                ctx.beginPath();
                ctx.arc(px, py, Math.max(0.6, b.r * (1 - dt / life * 0.5)), 0, TAU2);
                ctx.fill();
              }
            }
            ctx.restore();
          }
          PR.bubbles(ctx, sd('clinkbubbles'), dt, { x: CLINK_X - 160, y: CLINK_Y - 260, w: 320, h: 300 }, {
            count: 14, speed: 0.8, size: [5, 14],
          });
        }
      });

      // =========================================================================
      // caption "Prost!", screen-fixed outside the kick-zoom
      // =========================================================================
      if (t >= T_CLINK) {
        PR.caption(ctx, 'Prost!', 960, 260, 160, {
          align: 'center', style: 'gold', pop: clamp((t - T_CLINK) / (4 * FRAME) + 1 / 4), // +lead: visible on the beat frame
        });
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/09-chef-enter.js
// Shot 09 'chef-enter' — illustrated, T 16.0-18.5 (global), shot-local t 0..2.5.
// Handoff: 08 -> 09 is a hard cut (no shared geometry to match).
// Handoff: 09 -> 10 is a hard cut, but the chef's salsa keeps counting from the same clock
// (both files drive FILM.cast.chef's 'salsa' pose from info.T - 17.5) so the step does not jump.
//
// Layers back to front:
//   1. Hall background (door variant), the room dimmed from the very first frame.
//   2. The spotlight cone from top-left onto the doorway (storyboard: opening x 690-1230, floor y 880).
//   3. The chef (hero line), framed in the doorway: a head-gleam flare with its star sparkle
//      (T 16.25, handled by FILM.cast.chef's own o.gleam), ties the bandana on 8ths (T 16.5-17.5),
//      then two salsa steps with a grin to camera (T 18.0).
//   4. Foreground: two teammates at the tables' edge, turning to look toward the doorway.
//   5. A soft vignette (dark at the edges, clear over the spotlight) that reads the foreground
//      teammates as near-silhouettes without a second (masked) draw pass.
// Camera: a slow 1.00 -> 1.08 push-in on the chef.
(function () {
  'use strict';
  const FILM = window.FILM;
  const ID = 'chef-enter';

  // --- staging (storyboard 09; door variant opening x 690-1230, floor y 880) ---------------------
  const CHEF_X = 960, CHEF_Y = 1000, CHEF_H = 820;
  const SPOT_X0 = 420, SPOT_Y0 = 30, SPOT_X1 = 960, SPOT_Y1 = 880, SPOT_W = 640;

  // --- timing (shot-local seconds; T = 16.0 + t) --------------------------------------------------
  const T_GLEAM = 0.25;     // T 16.25: head gleam flare + star sparkle
  const GLEAM_LIFE = 0.55;
  const TIE_START = 0.5;    // T 16.5: pulls the bandana out and starts tying
  const TIE_END = 1.5;      // T 17.5: bandana on, dancing starts
  const GRIN_AT = 2.0;      // T 18.0: grin to camera
  const GRIN_WIN = 0.16;

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t); // characters animate on twos
      const Tg = info.T;
      const W = FILM.W, H = FILM.H;
      const CAST = FILM.cast, PROPS = FILM.props;

      const zoom = L.lerp(1.0, 1.08, L.ease.inOutSine(L.clamp(t / info.dur)));

      L.camera(ctx, { x: CHEF_X, y: 600, zoom }, () => {
        // 1. hall, dimmed the instant the shot starts ----------------------------------------
        PROPS.hallBack(ctx, { variant: 'door', dim: 0.82, t: Tg });

        // 2. the spotlight cone onto the doorway ----------------------------------------------
        PROPS.spotlight(ctx, SPOT_X0, SPOT_Y0, SPOT_X1, SPOT_Y1, SPOT_W, { alpha: 1 });

        // 3. the chef -----------------------------------------------------------------------
        // gleam is the sparkle's own 0..1 life: 0 outside the flare, sweeping through it once.
        const gleam = tw >= T_GLEAM && tw < T_GLEAM + GLEAM_LIFE ? L.clamp((tw - T_GLEAM) / GLEAM_LIFE) : 0;
        let pose, o = { line: 'hero', gleam };
        if (tw < TIE_START) {
          pose = { name: 'stand' };
          o.bandana = false; // bandana still in hand, not tied on yet
        } else if (tw < TIE_END) {
          pose = { name: 'tieBandana', k: L.clamp((tw - TIE_START) / (TIE_END - TIE_START)) };
        } else if (Math.abs(tw - GRIN_AT) < GRIN_WIN) {
          pose = { name: 'grin' };
        } else {
          pose = { name: 'salsa', t: Tg - 17.5 };
        }
        CAST.chef(ctx, CHEF_X, CHEF_Y, CHEF_H, pose, o);

        // 4. foreground teammates, silhouetted, turning to look toward the doorway -------------
        const TEAM = CAST.TEAM;
        const turnK = L.lerp(0.8, 0.42, L.ease.inOutSine(L.clamp(tw / info.dur)));
        CAST.person(ctx, TEAM[2], 130, 1130, 980, { name: 'turn', k: turnK }, {});
        CAST.person(ctx, TEAM[9], 1790, 1110, 960, { name: 'turn', k: turnK }, { flip: true });

        // 5. vignette: dark at the edges, clear over the spotlit doorway ------------------------
        // (tight enough that the foreground teammates, well outside r=0.85, read as near-silhouettes)
        const vg = ctx.createRadialGradient(CHEF_X, 560, 40, CHEF_X, 560, 900);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(0.4, 'rgba(0,0,0,0.05)');
        vg.addColorStop(0.65, 'rgba(0,0,0,0.4)');
        vg.addColorStop(0.85, 'rgba(0,0,0,0.8)');
        vg.addColorStop(1, 'rgba(0,0,0,0.93)');
        ctx.fillStyle = vg;
        ctx.fillRect(-400, -400, W + 800, H + 800);
      });
    },
  });
})();

</script>
<script>
// ---- src/scenes/10-salsa-shirts.js
// Shot 10 'salsa-shirts' — illustrated, T 18.5-22.5 (global), shot-local t 0..4.0.
// Handoff: 09 -> 10 is a hard cut; the chef's salsa step keeps counting from info.T - 17.5 so it
// does not jump at the cut (09 drives the same pose from the same clock).
//
// Composition (director's note on the first cut, addressed here): the chef is the clear foreground
// hero, large (h 750, feet y 1030) and drawn last of the cast so nothing (table or teammate) ever
// overlaps him; the two long tables run left and right of him at a smaller, mid-depth scale, the
// fifteen teammates seated along them facing the aisle/camera; the waitresses stand grounded on
// table A's own floor line, behind it, so they read as standing at the back, not floating.
//
// Layers back to front:
//   1. Hall background ('hall' variant), full brightness, panning 0.6x with the foreground (its own
//      parallax, art bible 1.2's three depth layers) as the camera follows the chef.
//   2. Bunting + bulb garland across the ceiling.
//   3. The four waitresses, grounded on table A's floor line, clapping (its structure partly hides
//      their legs, so they read as standing at the back of the hall).
//   4. Table A (far, smaller): 8 teammates seated on its aisle-facing bench.
//   5. Table B (near-mid, larger): 7 teammates seated on its aisle-facing bench.
//   6. The crate stencilled with the FESB mark, at the chef's starting mark.
//   7. The chef (hero): dancing the salsa basic down the aisle (x 700 -> 1200) and throwing all
//      fifteen t-shirts, one per 8th. Drawn after every table and teammate so nothing overlaps him.
//   8. The fifteen t-shirts, on top of everything: in flight (parabolic arc, dashed gold motion
//      trail) or caught and hugged by their teammate.
// Camera: a slow pan following the chef (a plain horizontal translate; the background parallaxes
// under its own camX so no gap opens at the edges).
(function () {
  'use strict';
  const FILM = window.FILM;
  const ID = 'salsa-shirts';
  const lerp = (a, b, u) => a + (b - a) * u;
  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);

  const sd = (...k) => FILM.lib.hash(ID, ...k) & 0x7fffffff;
  const FR = 1 / 24;

  // --- staging -------------------------------------------------------------------------------
  // The chef is the large foreground hero (director's note): feet near the bottom of the frame,
  // tall enough that the mid-depth tables (smaller, higher up) never compete with him for attention.
  const CHEF_X0 = 700, CHEF_X1 = 1200, CHEF_Y = 1030, CHEF_H = 750;
  // Two long tables at mid-depth, smaller than the chef, running the full width either side of
  // wherever he currently stands. Both benches are drawn with o.upper (person's documented idiom
  // for "people behind a table": cheap, no legs to solve, and they face the camera/aisle).
  const TABLE_A_X = 960, TABLE_A_Y = 440, TABLE_A_W = 2000, TABLE_A_LEGS = 110, TABLE_A_H = 190;
  const TABLE_B_X = 960, TABLE_B_Y = 640, TABLE_B_W = 2060, TABLE_B_LEGS = 150, TABLE_B_H = 260;
  const FLOOR_A = TABLE_A_Y + TABLE_A_LEGS;
  const FLOOR_B = TABLE_B_Y + TABLE_B_LEGS;
  // The waitresses stand just past table A's top edge and are drawn before it, so its own wood
  // panel (top to floor) hides their legs while their clapping arms clear it — grounded at the
  // back, not floating at chandelier height.
  const WAIT_Y = TABLE_A_Y + 40, WAIT_H = 190;
  const CRATE_X = 640, CRATE_Y = 1000, CRATE_W = 190;

  // --- timing (shot-local seconds; T = 18.5 + t) ----------------------------------------------
  const THROW_STEP = 0.25;              // one 8th at 120 bpm
  const N_THROWS = 15;
  const THROW_WIN = 0.18;               // the 'throw' pose pulse, centred on the release instant
  const CATCH_DUR = 0.3;                // arms-up -> hug, ending exactly on the catch beat
  const CATCH_SETTLE = 0.35;            // how long the hug is held before sitting back down
  const FLIGHT = 0.5;                   // one beat of flight, throw -> catch
  const APEX = 250;                     // px above the straight line, storyboard 10
  const HEAD_CLEAR = 120;               // the arc's peak clears at least this far above the bandana
  const EARLY_FRAMES = 4;               // draw the just-released shirt behind the chef for this long
  const EARLY_WIN = (EARLY_FRAMES * FR) / FLIGHT;
  const SPIN_START = 2.1, SPIN_END = 2.9; // T 20.6-21.4, bracketing the T 21.0 spin

  function throwTime(i) { return i * THROW_STEP; }       // t of release
  function catchTime(i) { return throwTime(i) + FLIGHT; } // t of catch

  // --- seating (pure geometry: x order across both benches decides throw order) ----------------
  let GEO = null;
  function geo() {
    if (GEO) return GEO;
    const TEAM = FILM.cast.TEAM;
    const seats = [];
    for (let j = 0; j < 8; j++) seats.push({ x: lerp(240, 1720, j / 7), table: 'A' });
    for (let j = 0; j < 7; j++) seats.push({ x: lerp(280, 1680, j / 6), table: 'B' });
    seats.sort((a, b) => a.x - b.x);
    seats.forEach((s, i) => {
      s.throwI = i;
      s.spec = TEAM[i];
      s.design = i % 2 === 0 ? 'jersey' : 'octo';
    });
    return (GEO = { seats });
  }

  // --- a crate stencilled with the FESB mark (no dedicated prop exists; built from FILM.props
  // primitives per scene-anatomy: "if a helper is missing, define it inside your own file") -------
  function drawCrate(ctx, L, P, x, y, w, seed) {
    const h = w * 0.6, lidBack = w * 0.16;
    const top = y - h, fl = x - w / 2, fr = x + w / 2;
    const b = L.boil(L.T);
    FILM.props.shape(ctx, [[fl - lidBack * 0.3, top - lidBack], [fr - lidBack * 0.3, top - lidBack], [fr, top], [fl, top]], {
      fill: P.woodLight, shade: { color: P.woodMid, side: 'right', frac: 0.3 }, width: 4, smooth: false, seed: seed + 1, boil: b,
    });
    FILM.props.shape(ctx, [[fl, top], [fr, top], [fr, y], [fl, y]], {
      fill: P.woodMid, shade: { color: P.woodDeep, side: 'right', frac: 0.26 }, width: 5, smooth: false, seed: seed + 2, boil: b,
    });
    ctx.save();
    ctx.strokeStyle = L.rgba(P.woodDeep, 0.55);
    ctx.lineWidth = Math.max(1.5, w * 0.02);
    ctx.beginPath();
    ctx.moveTo(fl + w * 0.08, top); ctx.lineTo(fl + w * 0.08, y);
    ctx.moveTo(fr - w * 0.08, top); ctx.lineTo(fr - w * 0.08, y);
    ctx.stroke();
    ctx.restore();
    FILM.props.fesbLogo(ctx, x, top + h * 0.44, w * 0.46, { outline: true });
  }

  // Note: FILM.cast.person/waitress/chef are NOT sprite-cached here, even though they are the
  // costliest draws. Their ink wobble defaults to the *ambient* lib.boil(lib.T) whenever a call
  // does not pin an explicit boil (and person/waitress/chef do not expose one to pin) — caching
  // their pixels across frames would bake in whichever frame's ambient time happened to build the
  // cache first, which the determinism pass (cold vs. warm-forward vs. shuffled) catches as a
  // mismatch. Only FILM.props functions thread boil explicitly (see cachedLayer below), so only
  // those are safe to cache across frames.

  // --- a cached world-space layer: paints `make(g, boil)` into an offscreen canvas spanning world
  // x [x0,x1) once per (name, boil-phase, render scale), then every later frame is one drawImage.
  // Boil (12 fps) still cycles the ink wobble through its 3 phases; nothing else here is t-varying,
  // so this is the same trick hallBack already uses for its own background. -----------------------
  function cachedLayer(ctx, L, name, x0, x1, Tg, make) {
    const S = FILM.S || 1, HH = FILM.H, WW = x1 - x0;
    const b = ((L.boil(Tg) % 3) + 3) % 3;
    const c = L.cached(['salsa-shirts', name, b, S].join('|'), () => {
      const cv = FILM.makeCanvas(Math.max(1, Math.round(WW * S)), Math.max(1, Math.round(HH * S)));
      const g = cv.getContext('2d');
      g.scale(S, S);
      g.translate(-x0, 0);
      make(g, b);
      return cv;
    });
    ctx.drawImage(c, x0, 0, WW, HH);
  }

  // A quadratic-bezier arc through (x0,y0) -> control (apexY at u=0.5) -> (x1,y1): lets a throw pin
  // its peak to an explicit screen y (so it can be forced above the chef's head) rather than only
  // ever bulging a fixed amount above the straight line.
  const arcX = (x0, x1, u) => lerp(x0, x1, u);
  const arcY = (y0, apexY, y1, u) => (1 - u) * (1 - u) * y0 + 2 * u * (1 - u) * apexY + u * u * y1;

  // --- a dashed gold motion trail behind a flying shirt (storyboard 10: 2.5 px, 14 on 10 off,
  // fading over 6 frames once it lands) --------------------------------------------------------
  function drawTrail(ctx, P, x0, y0, x1, y1, apexY, uEnd, alpha) {
    if (alpha <= 0.01 || uEnd <= 0.01) return;
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.strokeStyle = P.gold;
    ctx.lineWidth = 2.5;
    ctx.setLineDash([14, 10]);
    ctx.lineCap = 'round';
    ctx.beginPath();
    const n = 18;
    for (let i = 0; i <= n; i++) {
      const u = (uEnd * i) / n;
      const px = arcX(x0, x1, u), py = arcY(y0, apexY, y1, u);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
  }

  // --- the chef's actual right-hand anchor during a throw's release keyframe (pose 'throw', k 0.5),
  // as an offset from his own (x, y) base. The offset is a pure function of the pose and CHEF_H (no
  // ambient time involved), so it is computed once — via a throwaway canvas, since chef() has no
  // "anchors only" mode — and reused for every throw, on top of that throw's own world position.
  // This is what keeps every t-shirt leaving his hand instead of his chest or face. ------------------
  let HAND = null;
  function handAnchor(CAST) {
    if (HAND) return HAND;
    const cv = FILM.makeCanvas(4, 4);
    const r = CAST.chef(cv.getContext('2d'), 0, 0, CHEF_H, { name: 'throw', k: 0.5 }, { line: 'hero' });
    HAND = { dx: r.handR[0], dy: r.handR[1], headTopDy: r.head[1] - CHEF_H * 0.1 };
    return HAND;
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);
      const Tg = info.T;
      const CAST = FILM.cast, PROPS = FILM.props;
      const G = geo();

      // --- the chef's world position and the camera's slow, damped follow --------------------
      const travel = L.ease.inOutSine(t / info.dur);
      const chefX = lerp(CHEF_X0, CHEF_X1, travel);
      const panX = lerp(-90, 100, travel); // camera.x - 960; foreground pans by this, background by 0.6x

      // 1. hall background, parallaxing under its own camX -------------------------------------
      PROPS.hallBack(ctx, { variant: 'hall', camX: panX, dim: 0, t: Tg });

      ctx.save();
      ctx.translate(-panX, 0);

      // 2. the four waitresses, grounded on table A's floor line but drawn before its structure so
      //    the table's own wood panel hides their legs — standing at the back, not floating. --------
      const WHO = ['liesl', 'resi', 'vroni', 'gretl'];
      const WX = [460, 760, 1180, 1470];
      for (let i = 0; i < 4; i++) CAST.waitress(ctx, WX[i], WAIT_Y, WAIT_H, { name: 'clap', t: Tg }, { who: WHO[i], carry: 'none' });

      // 3. bunting + garland across the ceiling, plus both tables' structure (cached: see cachedLayer);
      //    table A's panel is drawn here, on top of the waitresses' legs from step 2. ----------------
      cachedLayer(ctx, L, 'furniture', -300, 2220, Tg, (g, b) => {
        PROPS.bunting(g, -260, 130, 2180, 130, 48, { seed: sd('bunt'), boil: b });
        PROPS.garland(g, -240, 178, 2160, 178, 42, { glow: 1, seed: sd('gar'), boil: b });
        PROPS.table(g, TABLE_A_X, TABLE_A_Y, TABLE_A_W, { depth: 20, legs: TABLE_A_LEGS, bench: 'front', seed: sd('tblA'), boil: b });
        PROPS.table(g, TABLE_B_X, TABLE_B_Y, TABLE_B_W, { depth: 28, legs: TABLE_B_LEGS, bench: 'front', seed: sd('tblB'), boil: b });
      });

      // helper: draws a seated teammate behind the table (o.upper: cheap, and the documented idiom
      // for "people behind a table") — idle until their catch window brings their arms up into a
      // hug, then back to idle for the rest of the shot.
      function drawSeat(s, floorY, h) {
        const cEnd = catchTime(s.throwI), cStart = cEnd - CATCH_DUR, cSettled = cEnd + CATCH_SETTLE;
        if (t < cStart || t >= cSettled) {
          CAST.person(ctx, s.spec, s.x, floorY, h, { name: 'stand' }, { upper: true });
        } else {
          const k = clamp01((t - cStart) / CATCH_DUR);
          CAST.person(ctx, s.spec, s.x, floorY, h, { name: 'catch', k }, { upper: true, shirt: s.design });
        }
      }

      // 4. both tables' seats — mid-depth, well clear of the chef's own foreground band -------------
      for (const s of G.seats) drawSeat(s, s.table === 'A' ? FLOOR_A : FLOOR_B, s.table === 'A' ? TABLE_A_H : TABLE_B_H);

      // 5. the crate at the chef's starting mark, at his feet in the foreground ----------------------
      drawCrate(ctx, L, P, CRATE_X, CRATE_Y, CRATE_W, sd('crate'));

      // helper: every throw's geometry — released from the chef's actual hand (handAnchor), the arc's
      // peak pinned at least HEAD_CLEAR above his bandana so it never crosses his head or torso.
      const H = handAnchor(CAST);
      const headTopY = CHEF_Y + H.headTopDy;
      function shirtGeom(s) {
        const ti = throwTime(s.throwI), tc = catchTime(s.throwI);
        if (t < ti || t > tc + 6 / 24) return null; // gone 6 frames after landing (trail fade window)
        const chefXi = lerp(CHEF_X0, CHEF_X1, L.ease.inOutSine(ti / info.dur));
        const x0 = chefXi + H.dx, y0 = CHEF_Y + H.dy;
        const x1 = s.x, y1 = (s.table === 'A' ? FLOOR_A - TABLE_A_H * 0.62 : FLOOR_B - TABLE_B_H * 0.62);
        const apexY = Math.min(lerp(y0, y1, 0.5) - APEX, headTopY - HEAD_CLEAR);
        return { ti, tc, u: clamp01((t - ti) / FLIGHT), x0, y0, x1, y1, apexY, design: s.design, throwI: s.throwI };
      }
      function drawFlying(g, alpha) {
        drawTrail(ctx, P, g.x0, g.y0, g.x1, g.y1, g.apexY, g.u, alpha);
        const px = arcX(g.x0, g.x1, g.u), py = arcY(g.y0, g.apexY, g.y1, g.u);
        const rot = g.u * Math.PI * 4 + ((sd('rot', g.throwI) % 1000) / 1000) * Math.PI * 2;
        const flap = (Tg * 6) % 1;
        CAST.tshirt(ctx, px, py, 170, { design: g.design, rot, flap, alpha, view: (Math.floor(g.u * 8) % 2) ? 'back' : 'front' });
      }

      // 6. the just-released shirt(s), for their first few frames only, drawn BEHIND the chef: right
      //    at release they are still close to his silhouette, so this — not geometry alone — is what
      //    guarantees nothing is ever seen lying across his face or chest. --------------------------
      for (const s of G.seats) {
        const g = shirtGeom(s);
        if (g && g.u < 1 && g.u < EARLY_WIN) drawFlying(g, 1);
      }

      // 7. the chef (hero): continuous salsa, punctuated by a throw pulse on every 8th, with a spin
      //    flourish woven in around T 21.0. Drawn after every table, teammate and the just-released
      //    shirt, so nothing else overlaps him. ------------------------------------------------------
      let chefPose = null;
      for (let i = 0; i < N_THROWS; i++) {
        const ti = throwTime(i);
        if (Math.abs(t - ti) <= THROW_WIN / 2) {
          chefPose = { name: 'throw', k: clamp01((t - (ti - THROW_WIN / 2)) / THROW_WIN) };
          break;
        }
      }
      if (!chefPose && t >= SPIN_START && t <= SPIN_END) {
        chefPose = { name: 'spin', k: clamp01((t - SPIN_START) / (SPIN_END - SPIN_START)) };
      }
      if (!chefPose) chefPose = { name: 'salsa', t: Tg - 17.5 };
      CAST.chef(ctx, chefX, CHEF_Y, CHEF_H, chefPose, { line: 'hero' });

      // 8. every other t-shirt in flight (past its first few frames, now well clear of him and above
      //    the tables), or fading after landing — drawn on top since they're clear of his silhouette --
      for (const s of G.seats) {
        const g = shirtGeom(s);
        if (!g) continue;
        if (g.u < 1) {
          if (g.u >= EARLY_WIN) drawFlying(g, 1);
        } else {
          const fadeAlpha = clamp01(1 - (t - g.tc) / (6 / 24));
          if (fadeAlpha > 0.01) drawTrail(ctx, P, g.x0, g.y0, g.x1, g.y1, g.apexY, 1, fadeAlpha);
        }
      }

      ctx.restore();
    },
  });
})();

</script>
<script>
// ---- src/scenes/11-jersey-wall.js
// Shot 11 'jersey-wall' (illustrated), T 22.5-25.0 global, 2.5 s local.
// Layers back to front:
//   1. Hall background (dimmed) with bunting and garland.
//   2. Back row: eight teammates standing, x 200-1640.
//   3. Front row: seven teammates crouching in the gaps between the back row.
//   4. The chef at the right edge, arms crossed, nodding at T 24.5.
// Motion: everyone opens already in their fesbBlue jerseys, front view, with a small bounce on the
// downbeat at T 22.5; T 23.0-24.0 a left-to-right turning wave, one column (a back-row man plus
// the front-row man ahead of him) per 16th note; T 24.0-25.0 all hold while the "FESB 9" print on
// every back gleams in the same left-to-right order. A slight 1.00 -> 1.04 push-in runs the shot.
(function () {
  'use strict';
  const ID = 'jersey-wall';

  // --- formation geometry (art bible 10.3, 10.8; storyboard 11) --------------------------------
  const BACK_X0 = 200, BACK_X1 = 1640;
  const BACK_Y = 830, FRONT_Y = 1005;
  const REF_H = 580; // reference figure height before each spec's own `tall` multiplier
  const FRONT_REF_H = 455; // the front row is drawn smaller so neighbours' arms clear the print
  const CHEF_X = 1786, CHEF_Y = 830;

  // TEAM indices placed left to right; TEAM[0..3] (the four named teammates) land in visible
  // spots, the tallest (TEAM[0]) at back column 3 - one left of the formation's centre.
  const BACK_TEAM = [4, 5, 6, 0, 1, 7, 2, 8];
  const FRONT_TEAM = [9, 10, 3, 11, 12, 13, 14];

  // Timing (shot-local seconds; T = 22.5 + t).
  const BOUNCE_DUR = 4 / 24; // a small squash-and-settle on the opening downbeat, T 22.5
  const TURN_START = 0.5; // T 23.0
  const TURN_STEP = 0.125; // one 16th per column
  const TURN_DUR = 0.125; // ~3 frames per column
  const HOLD_START = 1.5; // T 24.0
  const HOLD_END = 2.5; // T 25.0
  const GLEAM_DUR = 0.35;
  const NOD_START = 2.0; // T 24.5
  const NOD_DUR = 0.35;

  let GEO = null;
  function geo() {
    if (GEO) return GEO;
    const TEAM = FILM.cast.TEAM;
    const backX = (j) => BACK_X0 + (j * (BACK_X1 - BACK_X0)) / 7;
    const slots = [];
    for (let j = 0; j < 8; j++) {
      slots.push({ row: 'back', col: j, x: backX(j), y: BACK_Y, spec: TEAM[BACK_TEAM[j]] });
      if (j < 7) {
        const fx = (backX(j) + backX(j + 1)) / 2;
        slots.push({ row: 'front', col: j, x: fx, y: FRONT_Y, spec: TEAM[FRONT_TEAM[j]] });
      }
    }
    // gleam order is simply left-to-right through the interleaved list above.
    GEO = { slots };
    return GEO;
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);
      const CAST = FILM.cast, PROPS = FILM.props;
      const W = FILM.W, H = FILM.H;
      const G = geo();

      L.camera(ctx, { x: W / 2, y: H / 2, zoom: 1 + 0.04 * (t / info.dur) }, () => {
        // 1. background --------------------------------------------------------------------
        PROPS.hallBack(ctx, { variant: 'hall', dim: 0.3, t: info.T });
        PROPS.bunting(ctx, -40, 130, W + 40, 130, 46, { t: info.T, seed: L.hash(ID, 'bunt') });
        PROPS.garland(ctx, -20, 178, W + 20, 178, 40, { t: info.T, seed: L.hash(ID, 'gar') });

        // 2 & 3. the team ---------------------------------------------------------------------
        const turnK = (col) => L.clamp((t - (TURN_START + TURN_STEP * col)) / TURN_DUR);
        const gleamK = (idx) => {
          const start = HOLD_START + (idx * (HOLD_END - HOLD_START - GLEAM_DUR)) / (G.slots.length - 1);
          return L.clamp((t - start) / GLEAM_DUR);
        };
        // a single small squash-and-settle bounce for everyone together on the opening downbeat
        const bounceK = L.clamp(t / BOUNCE_DUR);
        const squash = L.lerp(0.88, 1, L.ease.outBack(bounceK));
        for (let i = 0; i < G.slots.length; i++) {
          const s = G.slots[i];
          const crouch = s.row === 'front';
          const refH = crouch ? FRONT_REF_H : REF_H;
          const gleam = t >= HOLD_START ? gleamK(i) : 0;
          const pose = { name: 'turn', k: turnK(s.col), crouch };
          if (bounceK < 1) {
            ctx.save();
            ctx.translate(s.x, s.y);
            ctx.scale(1, squash);
            ctx.translate(-s.x, -s.y);
            CAST.person(ctx, s.spec, s.x, s.y, refH, pose, { outfit: 'jersey', gleam });
            ctx.restore();
          } else {
            CAST.person(ctx, s.spec, s.x, s.y, refH, pose, { outfit: 'jersey', gleam });
          }
        }

        // 4. the chef, arms crossed, grinning, a single nod at T 24.5 --------------------------
        const nodK = L.clamp((t - NOD_START) / NOD_DUR);
        CAST.chef(ctx, CHEF_X, CHEF_Y, REF_H * CAST.CHEF_TALL, { name: 'nod', k: nodK }, {});
      });
    },
  });
})();

</script>
<script>
// ---- src/scenes/12-foam-nine.js
// Shot 12 'foam-nine' (illustrated), T 25.0-28.0 global, 3.0 s local.
// Layers back to front:
//   1. Hall background (warm, busy) with bunting and garland.
//   2. The team, small, cheering along the back wall.
//   3. The foam "9" (G3: centred 620,520, 620 px tall, 70 px stroke), drawn stroke by stroke.
//   4. The chef, centre-right, with the hero mug: winds up, spins twice flinging the foam trail,
//      then raises the mug into the G3 pose, held to the end (handoff to 13).
//   5. The finished 9's gold flash and sparkles, screen-fixed.
// The chef's base position (feet 1010, centre x 1180, height 860) never moves: it already IS G3,
// so the 'raiseMug' pose (built from the same G3 constant in cast.js) lands the mug exactly on
// (1300, 330) at height 200 with no extra bookkeeping here.
(function () {
  'use strict';
  const ID = 'foam-nine';
  const DEG = Math.PI / 180;

  const CHEF_X = 1180, CHEF_Y = 1010, CHEF_H = 860;
  // The 'spin' pose's raised arm carries the mug well above head height; at the full G3 height
  // (860) that pushes it off the top of the frame, so the windup and the two spins are drawn at a
  // smaller height (verified against the frame with tools/verify) and only grow to the G3 hero
  // height while the mug comes down into its raised, on-camera position (RAISE_START on).
  const CHEF_H_SPIN = 600;
  const TEAM_Y = 660, TEAM_H = 380, TEAM_X0 = 250, TEAM_X1 = 1670;

  // Timing (shot-local seconds; T = 25.0 + t).
  const WINDUP_END = 0.5; // T 25.5
  const SPIN_START = 0.5, SPIN_END = 2.0; // T 25.5-27.0, two full turns
  const SPIN_DUR = SPIN_END - SPIN_START;
  const RAISE_START = 2.0, RAISE_DUR = 0.5; // T 27.0-27.5, then holds
  const FLASH_START = 2.0, FLASH_DUR = 0.4;

  // --- the foam "9" (storyboard G3: centred 620,520, 620 px tall) ---------------------------------
  // An unmistakable numeral: a round CLOSED loop (width 0.85 x height) filling the top ~55% of the
  // 620 px box, and a tail that leaves the loop at its rightmost point and curves down and
  // slightly left to the baseline, staying outside the loop the whole way (never crossing back
  // above or through it). Director-reviewed polyline (script coordinates, y down):
  //   loop (ellipse, cx 620 cy 380, rx 145 ry 170), sampled every 30 deg from the top, CCW:
  //     (620,220) (547,243) (494,305) (475,380) (494,455) (547,517) (620,550)
  //     (693,517) (746,455) (765,380) (746,305) (693,243) -> closes back to (620,220)
  //   tail (cubic bezier from the loop's right point to the baseline):
  //     P0 (765,380) C1 (770,530) C2 (700,750) P1 (595,830)
  //     sampled: (765,380) (759,477) (738,579) (702,677) (653,759) (595,830)
  const NINE_CX = 620, NINE_CY = 520, NINE_STROKE = 70;
  const LOOP_CX = 620, LOOP_CY = 380, LOOP_RX = 145, LOOP_RY = 170;
  const TAIL_P0 = [LOOP_CX + LOOP_RX, LOOP_CY], TAIL_C1 = [770, 530], TAIL_C2 = [700, 750], TAIL_P1 = [595, 830];
  function bez(p0, c1, c2, p1, u) {
    const mu = 1 - u, a = mu * mu * mu, b = 3 * mu * mu * u, c = 3 * mu * u * u, d = u * u * u;
    return [a * p0[0] + b * c1[0] + c * c2[0] + d * p1[0], a * p0[1] + b * c1[1] + c * c2[1] + d * p1[1]];
  }
  function arcLen(pts) {
    let total = 0;
    const S = [0];
    for (let i = 1; i < pts.length; i++) {
      total += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      S.push(total);
    }
    return { S, total };
  }
  let GEO = null;
  function geo() {
    if (GEO) return GEO;
    const TEAM = FILM.cast.TEAM;
    // background row, small, spread along the back wall behind the chef.
    const crowd = [];
    for (let i = 0; i < TEAM.length; i++) {
      crowd.push({ spec: TEAM[i], x: TEAM_X0 + (i * (TEAM_X1 - TEAM_X0)) / (TEAM.length - 1), y: TEAM_Y });
    }
    // the loop: a closed ellipse traced from the top, counter-clockwise (decreasing angle).
    const nLoop = 96;
    const loop = [];
    for (let i = 0; i <= nLoop; i++) {
      const a = (-90 - (i / nLoop) * 360) * DEG;
      loop.push([LOOP_CX + Math.cos(a) * LOOP_RX, LOOP_CY + Math.sin(a) * LOOP_RY]);
    }
    // the tail: a separate stroke leaving the loop's right side, curving down and left.
    const nTail = 48;
    const tail = [];
    for (let i = 0; i <= nTail; i++) tail.push(bez(TAIL_P0, TAIL_C1, TAIL_C2, TAIL_P1, i / nTail));
    const loopArc = arcLen(loop), tailArc = arcLen(tail);
    // sample points across both, for the completion sparkles.
    const allPts = loop.concat(tail.slice(1));
    GEO = {
      crowd, loop, tail, loopArc, tailArc, allPts,
      loopFrac: loopArc.total / (loopArc.total + tailArc.total),
      bbox: { x: NINE_CX - 260, y: NINE_CY - 310, w: 520, h: 620 },
    };
    return GEO;
  }
  function clamp01(v) {
    return v < 0 ? 0 : v > 1 ? 1 : v;
  }
  function pointAtFrac(G, u) {
    const pts = G.allPts;
    const target = (G.loopArc.total + G.tailArc.total) * clamp01(u);
    // allPts is loop (arc-length G.loopArc) followed by tail (continuing past loopArc.total)
    if (target <= G.loopArc.total) {
      const S = G.loopArc.S;
      let i = 1;
      while (i < S.length - 1 && S[i] < target) i++;
      return pts[i];
    }
    const S = G.tailArc.S, rel = target - G.loopArc.total;
    let i = 1;
    while (i < S.length - 1 && S[i] < rel) i++;
    return pts[G.loop.length - 1 + i];
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);
      const CAST = FILM.cast, PROPS = FILM.props;
      const W = FILM.W, H = FILM.H;
      const G = geo();

      // 1. background --------------------------------------------------------------------------
      PROPS.hallBack(ctx, { variant: 'hall', dim: 0.22, t: info.T });
      PROPS.bunting(ctx, -40, 130, W + 40, 130, 46, { t: info.T, seed: L.hash(ID, 'bunt') });
      PROPS.garland(ctx, -20, 178, W + 20, 178, 40, { t: info.T, seed: L.hash(ID, 'gar') });

      // 2. the team cheering at the back ---------------------------------------------------------
      for (let i = 0; i < G.crowd.length; i++) {
        const c = G.crowd[i];
        const ph = 0.35 + 0.65 * ((L.hash(ID, 'cheer', i) & 255) / 255);
        CAST.person(ctx, c.spec, c.x, c.y, TEAM_H, { name: 'cheer', t: t * ph + i }, { outfit: 'jersey' });
      }

      // 3. the foam "9": the closed loop first (CCW from the top), then the tail --------------------
      const nineU = L.clamp((t - SPIN_START) / SPIN_DUR);
      if (nineU > 0) {
        const seed = L.hash(ID, 'nine');
        const loopU = L.clamp(nineU / G.loopFrac);
        const tailU = L.clamp((nineU - G.loopFrac) / (1 - G.loopFrac));
        const strokes = [
          { pts: G.loop, arc: G.loopArc, u: loopU, closed: true, seedBase: seed },
          { pts: G.tail, arc: G.tailArc, u: tailU, closed: false, seedBase: seed + 100 },
        ];
        for (const s of strokes) {
          if (s.u <= 0) continue;
          const draw = s.u, pts = s.pts;
          // faint dark edge so the glyph separates from the busy crowd behind it
          L.inkPath(ctx, pts, { closed: s.closed, width: NINE_STROKE + 12, color: P.outline, alpha: 0.28, seed: s.seedBase + 1, taper: [16, 16], smooth: true, draw, wobble: 1.6, tremble: 0.4 });
          // a thin gold/goldDeep edge peeking out from under the foam
          L.inkPath(ctx, pts, { closed: s.closed, width: NINE_STROKE + 6, color: P.goldDeep, seed: s.seedBase + 2, taper: [14, 14], smooth: true, draw, wobble: 1.8, tremble: 0.45 });
          // the uniform foam body
          L.inkPath(ctx, pts, { closed: s.closed, width: NINE_STROKE, color: P.foam, seed: s.seedBase, taper: [12, 12], smooth: true, draw, wobble: 1.8, tremble: 0.45, double: { width: 0.18, alpha: 0.25, seed: s.seedBase + 3 } });
          // a lighter core down the middle for volume
          L.inkPath(ctx, pts, { closed: s.closed, width: NINE_STROKE * 0.36, color: L.rgba(P.gloss, 0.6), seed: s.seedBase + 4, taper: [20, 40], smooth: true, draw, wobble: 1.2 });
        }
        // gold bubbles, more of them as more foam has been laid down
        PROPS.bubbles(ctx, L.hash(ID, 'bub'), Math.max(0, t - SPIN_START), G.bbox, { count: Math.round(26 * nineU), speed: 0.9, size: [5, 16] });
      }

      // 4. the chef, holding the hero mug throughout ----------------------------------------------
      const spinRaw = L.clamp((t - SPIN_START) / SPIN_DUR) * 2;
      let pose, tilt = 0, slosh = 0, chefH = CHEF_H_SPIN;
      if (t < WINDUP_END) {
        const k = 0.12 * Math.sin(Math.PI * (t / WINDUP_END));
        pose = { name: 'spin', k };
      } else if (t < RAISE_START) {
        const k = spinRaw - Math.floor(spinRaw);
        pose = { name: 'spin', k };
        tilt = 0.32 * Math.sin(spinRaw * Math.PI * 2);
        slosh = 0.6 * Math.sin(spinRaw * Math.PI * 2);
      } else {
        const k = L.clamp((t - RAISE_START) / RAISE_DUR);
        pose = { name: 'raiseMug', k };
        chefH = L.lerp(CHEF_H_SPIN, CHEF_H, L.ease.inOutCubic(k));
      }
      CAST.chef(ctx, CHEF_X, CHEF_Y, chefH, pose, {
        mug: { fill: 0.85, foam: 1.05, logo: true, bubbles: true, tilt, slosh, t },
        bandana: true,
      });

      // 5. the finished 9 flashes gold and sparkles, screen-fixed ---------------------------------
      const flash = t >= FLASH_START ? L.clamp(1 - (t - FLASH_START) / FLASH_DUR) : 0;
      if (flash > 0) {
        ctx.save();
        const cx = NINE_CX + 14, cy = NINE_CY - 20;
        const r = 420;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, L.rgba(P.gold, 0.55 * flash));
        g.addColorStop(0.55, L.rgba(P.gold, 0.22 * flash));
        g.addColorStop(1, L.rgba(P.gold, 0));
        ctx.fillStyle = g;
        ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
        ctx.restore();
        for (let i = 0; i < 7; i++) {
          const u = (i + 0.5) / 7;
          const p = pointAtFrac(G, u);
          const k = L.clamp((t - FLASH_START - i * 0.035) / 0.4);
          const rr = 34 + 14 * ((L.hash(ID, 'spk', i) & 255) / 255);
          PROPS.sparkle(ctx, p[0], p[1], rr, k);
        }
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/13-mug-camera.js
// Shot 13 'mug-camera', T 28.0-30.5 (illustrated).
// The mug comes to the camera: starts exactly on G3 (the chef's raised mug, the foam 9 fading on
// the left), then the mug approaches and grows until it exactly fills the frame at G4, handing off
// to 14's lockup pull-back. Layers back to front:
//   1. hall background + bunting + garland + the chef, all zoomed 1.0 -> 1.3 and falling out of frame
//   2. bubbles behind the mug
//   3. the fading foam "9" (G3's handoff from 12), screen-fixed
//   4. the hero mug, screen-fixed, growing from G3 to G4
//   5. a few large bubbles streaming past close to the camera
(function () {
  'use strict';
  const FILM = window.FILM;
  const ID = 'mug-camera';
  const LIB = FILM.lib;
  const TAU = LIB.TAU;

  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;

  // ---------------------------------------------------------------------------
  // Shared geometry (docs/storyboard.md): G3 (12 end / 13 start), G4 (13 end / 14 start).
  // G3 is the chef's raised mug: centred (1300, 330), height 200 -> base (1300, 430).
  // G4 is read off the mug's own logo anchor so it always lands the FESB logo exactly on
  // (960, 560) at size 400, per the storyboard, instead of a hand-copied number.
  // ---------------------------------------------------------------------------
  const G3 = { x: 1300, y: 430, h: 200 };
  const G4 = (() => {
    const probe = FILM.props.mug(null, 0, 0, 1000, { alpha: 0 }); // pure geometry, draws nothing
    const yFrac = probe.logo[1] / 1000, sFrac = probe.logo[2] / 1000;
    const h = 400 / sFrac;
    return { x: 960, y: 560 - yFrac * h, h };
  })();

  const clamp = LIB.clamp, lerp = LIB.lerp, smoothstep = LIB.smoothstep, E = LIB.ease;

  // A fading copy of 12's foam "9", matched exactly (screen space and stroke styling) to 12's own
  // redraw: not 12's stroke-by-stroke build, which 12 owns, just its final shape and look, fading out.
  //   Loop: closed ellipse cx=620 cy=380 rx=145 ry=170, traced CCW from the top (620, 220).
  //   Tail: cubic bezier P0=(765,380) C1=(770,530) C2=(700,750) P1=(595,830).
  //   Strokes, widest (bottom) to narrowest (top): dark outline (P.outline, +12, low alpha), a thin
  //   goldDeep edge (+6), the uniform 70 px foam body, a lighter gloss core (x0.36).
  function foamNine(ctx, P, alpha) {
    if (alpha <= 0.003) return;
    const sw = 70;
    const cx = 620, cy = 380, rx = 145, ry = 170;
    const p0 = [765, 380], c1 = [770, 530], c2 = [700, 750], p1 = [595, 830];
    const loop = new Path2D();
    loop.ellipse(cx, cy, rx, ry, 0, 0, TAU, true); // CCW
    const tail = new Path2D();
    tail.moveTo(p0[0], p0[1]);
    tail.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], p1[0], p1[1]);
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const pass = (color, width, a) => {
      ctx.globalAlpha = alpha * a;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke(loop);
      ctx.stroke(tail);
    };
    pass(P.outline, sw + 12, 0.35);
    pass(P.goldDeep, sw + 6, 1);
    ctx.globalAlpha = alpha;
    const grad = ctx.createLinearGradient(cx - rx, cy - ry, cx * 0.9, p1[1]);
    grad.addColorStop(0, P.foam);
    grad.addColorStop(1, P.foamShade);
    ctx.strokeStyle = grad;
